<!DOCTYPE html>
<html lang='zh-CN'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>Cookie测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .test-result {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .success { background: #d4edda; border-color: #c3e6cb; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Cookie测试页面</h1>
    
    <div id="cookie-info" class="test-result">
        <h3>当前Cookie</h3>
        <p id="cookie-text">读取中...</p>
    </div>
    
    <div>
        <button onclick="testLogin()">测试登录</button>
        <button onclick="testUser()">测试用户API</button>
        <button onclick="clearCookies()">清除Cookie</button>
        <button onclick="refreshCookie()">刷新Cookie信息</button>
    </div>
    
    <div id="results"></div>

    <script>
        function refreshCookie() {
            const cookies = document.cookie;
            document.getElementById('cookie-text').textContent = cookies || '没有Cookie';
            
            if (cookies) {
                document.getElementById('cookie-info').className = 'test-result success';
            } else {
                document.getElementById('cookie-info').className = 'test-result error';
            }
        }
        
        async function testLogin() {
            const results = document.getElementById('results');
            results.innerHTML = '<p>测试登录中...</p>';
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        username: 'REDACTED_USER',
                        password: '123456'
                    })
                });
                
                const data = await response.json();
                
                let html = '<div class="test-result">';
                html += '<h3>登录测试结果</h3>';
                html += '<p>状态码: ' + response.status + '</p>';
                html += '<p>响应: ' + JSON.stringify(data) + '</p>';
                html += '</div>';
                
                results.innerHTML = html;
                
                // 等待一下后检查cookie
                setTimeout(refreshCookie, 500);
            } catch (error) {
                results.innerHTML = '<div class="test-result error"><h3>登录测试失败</h3><p>' + error.message + '</p></div>';
            }
        }
        
        async function testUser() {
            const results = document.getElementById('results');
            results.innerHTML = '<p>测试用户API...</p>';
            
            try {
                const response = await fetch('/api/user', {
                    credentials: 'include'
                });
                
                if (response.ok) {
                    const data = await response.json();
                    results.innerHTML = '<div class="test-result success"><h3>用户API测试成功</h3><p>' + JSON.stringify(data) + '</p></div>';
                } else {
                    const error = await response.text();
                    results.innerHTML = '<div class="test-result error"><h3>用户API测试失败</h3><p>' + error + '</p></div>';
                }
            } catch (error) {
                results.innerHTML = '<div class="test-result error"><h3>用户API测试失败</h3><p>' + error.message + '</p></div>';
            }
        }
        
        function clearCookies() {
            document.cookie.split(';').forEach(cookie => {
                const eqPos = cookie.indexOf('=');
                const name = eqPos > -1 ? cookie.substr(0, eqPos) : cookie;
                document.cookie = name + '=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/';
            });
            refreshCookie();
        }
        
        // 页面加载时显示cookie
        refreshCookie();
    </script>
</body>
</html>
