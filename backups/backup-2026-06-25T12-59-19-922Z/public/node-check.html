<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STC - 服务器节点检测</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 30%, rgba(102, 126, 234, 0.3) 0%, transparent 50%),
                        radial-gradient(circle at 70% 70%, rgba(118, 75, 162, 0.3) 0%, transparent 50%);
            animation: bgMove 20s linear infinite;
        }

        @keyframes bgMove {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 600px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3),
                        inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-container {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
        }

        .status-banner {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(16, 185, 129, 0.1));
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 16px;
            padding: 16px 20px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-icon {
            width: 40px;
            height: 40px;
            background: rgba(16, 185, 129, 0.3);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .status-text h4 {
            color: #10b981;
            font-size: 14px;
            margin-bottom: 4px;
        }

        .status-text p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
        }

        .progress-container {
            margin-bottom: 24px;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .progress-label {
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
        }

        .progress-percent {
            color: #667eea;
            font-weight: 600;
            font-size: 13px;
        }

        .progress-bar {
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 3px;
            transition: width 0.5s ease;
            width: 0;
        }

        .servers-section h3 {
            color: #fff;
            font-size: 16px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .servers-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .server-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .server-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: #10b981;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .server-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(5px);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .server-item.selected {
            background: rgba(102, 126, 234, 0.2);
            border-color: rgba(102, 126, 234, 0.5);
            box-shadow: 0 0 30px rgba(102, 126, 234, 0.2);
        }

        .server-item.selected::before {
            opacity: 1;
            background: linear-gradient(180deg, #667eea, #764ba2);
        }

        .server-item.offline {
            opacity: 0.5;
        }

        .server-item.offline::before {
            background: #ef4444;
            opacity: 1;
        }

        .server-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .server-icon {
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: all 0.3s;
        }

        .server-item.selected .server-icon {
            background: rgba(102, 126, 234, 0.3);
            transform: scale(1.1);
        }

        .server-info h4 {
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .server-info p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
        }

        .server-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .ping-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .ping-badge.medium {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
            border-color: rgba(245, 158, 11, 0.3);
        }

        .ping-badge.high {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.3);
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        .status-badge.offline {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }

        .go-button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 24px;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .go-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }

        .go-button:active {
            transform: translateY(0);
        }

        .footer {
            margin-top: 24px;
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
        }

        .footer a {
            color: #667eea;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            .glass-card {
                padding: 24px 20px;
            }
            
            .title {
                font-size: 22px;
            }
            
            .server-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            
            .server-right {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="glass-card">
            <div class="header">
                <div class="logo-container">🚀</div>
                <h1 class="title">STC 服务器节点检测</h1>
                <p class="subtitle">智能选择最优节点，享受极速体验</p>
            </div>

            <div class="status-banner">
                <div class="status-icon">✓</div>
                <div class="status-text">
                    <h4>检测完成 · 最优节点已选定</h4>
                    <p>主力1站 · 响应时间 79ms</p>
                </div>
            </div>

            <div class="progress-container">
                <div class="progress-header">
                    <span class="progress-label">节点检测进度</span>
                    <span class="progress-percent" id="progress-text">100%</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>

            <div class="servers-section">
                <h3>📡 可用节点</h3>
                <div class="servers-list">
                    <div class="server-item selected" data-url="/home" data-name="主力1站">
                        <div class="server-left">
                            <div class="server-icon">🏠</div>
                            <div class="server-info">
                                <h4>主力1站</h4>
                                <p>Primary Server · 中国大陆</p>
                            </div>
                        </div>
                        <div class="server-right">
                            <span class="ping-badge">79ms</span>
                            <span class="status-badge">推荐</span>
                        </div>
                    </div>

                    <div class="server-item" data-url="/home" data-name="主力2站">
                        <div class="server-left">
                            <div class="server-icon">🏠</div>
                            <div class="server-info">
                                <h4>主力2站</h4>
                                <p>Secondary Server · 中国大陆</p>
                            </div>
                        </div>
                        <div class="server-right">
                            <span class="ping-badge medium">182ms</span>
                        </div>
                    </div>

                    <div class="server-item" data-url="/home" data-name="备用1站">
                        <div class="server-left">
                            <div class="server-icon">🔄</div>
                            <div class="server-info">
                                <h4>备用1站</h4>
                                <p>Backup Server · 亚太地区</p>
                            </div>
                        </div>
                        <div class="server-right">
                            <span class="ping-badge high">1230ms</span>
                        </div>
                    </div>

                    <div class="server-item offline" data-url="/home" data-name="备用2站">
                        <div class="server-left">
                            <div class="server-icon">🔒</div>
                            <div class="server-info">
                                <h4>备用2站</h4>
                                <p>Standby Server · 维护中</p>
                            </div>
                        </div>
                        <div class="server-right">
                            <span class="status-badge offline">离线</span>
                        </div>
                    </div>
                </div>
            </div>

            <button class="go-button" id="go-btn" onclick="window.location.href='/home'">🚀 前往选定节点</button>

            <div class="footer">
                <p>© 2024 STC Platform · <a href="/login">管理登录</a></p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const serverItems = document.querySelectorAll('.server-item:not(.offline)');
            const goBtn = document.getElementById('go-btn');
            const progressFill = document.getElementById('progress-fill');
            const progressText = document.getElementById('progress-text');
            
            let selectedServer = document.querySelector('.server-item.selected');
            
            // 进度条动画
            let progress = 0;
            const interval = setInterval(() => {
                progress += 2;
                progressFill.style.width = progress + '%';
                progressText.textContent = progress + '%';
                if (progress >= 100) {
                    clearInterval(interval);
                }
            }, 30);
            
            // 点击选择服务器
            serverItems.forEach(item => {
                item.addEventListener('click', () => {
                    serverItems.forEach(i => i.classList.remove('selected'));
                    item.classList.add('selected');
                    selectedServer = item;
                    
                    // 更新按钮文字
                    const name = item.dataset.name;
                    goBtn.textContent = `🚀 前往 ${name}`;
                });
            });
            
            // 前往按钮
            goBtn.addEventListener('click', () => {
                if (selectedServer) {
                    const url = selectedServer.dataset.url;
                    window.location.href = url;
                }
            });
        });
    </script>
</body>
</html>
