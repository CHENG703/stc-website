<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>孟轩网 - 智能域名跳转</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.05'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
            pointer-events: none;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .rocket-icon {
            font-size: 56px;
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #fff, #e0e5ec);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
        }

        .status-bar {
            margin-bottom: 30px;
        }

        .status-text {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-text .status-dot {
            width: 8px;
            height: 8px;
            background: #10b981;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .progress-bar {
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #10b981, #34d399);
            border-radius: 2px;
            animation: progress 2s ease-out forwards;
            width: 0;
        }

        @keyframes progress {
            to { width: 100%; }
        }

        .servers-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .server-item {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .server-item:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateX(5px);
        }

        .server-item.active {
            background: rgba(16, 185, 129, 0.2);
            border-color: rgba(16, 185, 129, 0.5);
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
        }

        .server-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .server-icon {
            width: 32px;
            height: 32px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .server-item.active .server-icon {
            background: rgba(16, 185, 129, 0.3);
        }

        .server-details h4 {
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .server-details p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
        }

        .server-meta {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .ping {
            font-size: 13px;
            font-weight: 600;
            color: #10b981;
        }

        .ping.warning {
            color: #f59e0b;
        }

        .ping.danger {
            color: #ef4444;
        }

        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            background: rgba(16, 185, 129, 0.3);
            color: #10b981;
        }

        .footer {
            margin-top: 30px;
            text-align: center;
        }

        .footer-text {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        @media (max-width: 600px) {
            .glass-card {
                padding: 30px 20px;
            }
            
            .title {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="glass-card">
            <div class="header">
                <div class="rocket-icon">🚀</div>
                <h1 class="title">孟轩网 - 智能域名跳转</h1>
                <p class="subtitle">正在检测可用域名节点，将自动为您跳转到最快的节点</p>
            </div>

            <div class="status-bar">
                <div class="status-text">
                    <span class="status-dot"></span>
                    <span>检测完成！最快节点: 主力1站 (79ms)</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill"></div>
                </div>
            </div>

            <div class="servers-list">
                <div class="server-item active">
                    <div class="server-info">
                        <div class="server-icon">🏠</div>
                        <div class="server-details">
                            <h4>主力1站</h4>
                            <p>Primary Server</p>
                        </div>
                    </div>
                    <div class="server-meta">
                        <span class="ping">79ms</span>
                        <span class="badge">最优</span>
                    </div>
                </div>

                <div class="server-item">
                    <div class="server-info">
                        <div class="server-icon">🏠</div>
                        <div class="server-details">
                            <h4>主力2站</h4>
                            <p>Secondary Server</p>
                        </div>
                    </div>
                    <div class="server-meta">
                        <span class="ping">182ms</span>
                    </div>
                </div>

                <div class="server-item">
                    <div class="server-info">
                        <div class="server-icon">🏠</div>
                        <div class="server-details">
                            <h4>主立2站</h4>
                            <p>Backup Server</p>
                        </div>
                    </div>
                    <div class="server-meta">
                        <span class="ping">182ms</span>
                    </div>
                </div>

                <div class="server-item">
                    <div class="server-info">
                        <div class="server-icon">🔄</div>
                        <div class="server-details">
                            <h4>备用1站</h4>
                            <p>Standby Server</p>
                        </div>
                    </div>
                    <div class="server-meta">
                        <span class="ping danger">1230ms</span>
                    </div>
                </div>
            </div>

            <div class="footer">
                <p class="footer-text">© 2024 孟轩网 - 智能域名跳转系统</p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const serverItems = document.querySelectorAll('.server-item');
            
            serverItems.forEach(item => {
                item.addEventListener('click', () => {
                    serverItems.forEach(i => i.classList.remove('active'));
                    item.classList.add('active');
                    
                    const badge = item.querySelector('.badge');
                    if (!badge) {
                        const serverMeta = item.querySelector('.server-meta');
                        const newBadge = document.createElement('span');
                        newBadge.className = 'badge';
                        newBadge.textContent = '已选择';
                        serverMeta.appendChild(newBadge);
                    }
                });
            });
        });
    </script>
</body>
</html>
