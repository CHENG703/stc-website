<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script src="/js/device-id.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STC任务网站 - 欢迎访问</title>
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="googlebot" content="noindex, nofollow">
    <meta name="slurp" content="noindex, nofollow">
    <meta name="spider" content="noindex, nofollow">
    <meta name="bot" content="noindex, nofollow">
    <meta name="crawler" content="noindex, nofollow">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="css/style-v5.css?v=16">
    <script src="js/lang.js"></script>
    <script src="js/config.js"></script>
    <script src="js/bj-time.js?v=16"></script>
    <style>
        /* 首页公告区 */
        .announcements-section {
            padding: 26px 0 6px;
        }
        .announcements-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 18px;
        }
        .announcement-card {
            background: var(--card-bg, rgba(255, 255, 255, 0.06));
            border: 1px solid var(--border-color, rgba(255, 255, 255, 0.1));
            border-radius: 12px;
            padding: 14px 16px;
        }
        .announcement-card .announcement-head {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }
        .announcement-card .announcement-title {
            font-weight: 600;
            color: var(--text-primary, #f1f5f9);
            font-size: 15px;
        }
        .announcement-card .announcement-meta {
            font-size: 12px;
            color: var(--text-secondary, #94a3b8);
            white-space: nowrap;
        }
        .announcement-card .announcement-content {
            color: var(--text-secondary, #cbd5e1);
            font-size: 14px;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>
<body>
    <div class="aurora-bg">
        <div class="aurora-blob aurora-blob-1"></div>
        <div class="aurora-blob aurora-blob-2"></div>
    </div>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <a href="/home" data-lang="nav.brand">STC工会任务平台</a>
            </div>
            <ul class="nav-menu" id="navMenu">
                <li><a href="/home" class="active" data-lang="nav.home">首页</a></li>
                <li><a href="/about" data-lang="nav.about">关于我们</a></li>
                <li><a href="/products" data-lang="nav.products">产品</a></li>
                <li><a href="#tasks" data-lang="nav.tasks">任务</a></li>
                <li><a href="/reaction">测试</a></li>
                <li><a href="#messages" data-lang="nav.messages">留言</a></li>
                <li><button id="theme-toggle" class="theme-toggle" onclick="toggleTheme()">🌙</button></li>
                <li id="nav-user"><a href="/login" data-lang="nav.login">登录</a></li>
            </ul>
        </div>
    </nav>

    <main>
        <section class="hero">
            <div class="container">
                <h1 data-lang="home.title">欢迎来到STC任务网站</h1>
                <p data-lang="home.subtitle">一个现代化的社区平台，分享你的想法</p>
                <div class="hero-quote">
                    <p class="quote-text" id="quote-text"></p>
                    <p class="quote-source" id="quote-source"></p>
                </div>
                <div class="hero-buttons" id="hero-buttons">
                    <a href="/register" class="btn btn-primary">立即注册</a>
                    <a href="/login" class="btn btn-secondary" data-lang="nav.login">登录</a>
                    <a href="/join.html" class="btn btn-secondary">加入我们</a>
                </div>
            </div>
        </section>

        <section id="announcements" class="announcements-section">
            <div class="container">
                <h2 class="section-title">📢 平台公告</h2>
                <div id="announcements-list" class="announcements-list">
                    <div class="loading">加载中...</div>
                </div>
            </div>
        </section>

        <section id="tasks" class="tasks-section">
            <div class="container">
                <div class="tasks-header">
                    <h2 class="section-title" data-lang="home.tasksTitle">最近任务</h2>
                    <button id="btn-publish-task" onclick="publishTask()" class="btn btn-primary btn-sm">
                        ➕ 发布任务
                    </button>
                </div>
                
                <!-- 任务统计 -->
                <div id="task-stats" class="task-stats">
                    <div class="loading" data-lang="common.loading">加载统计中...</div>
                </div>
                
                <!-- 任务分类 -->
                <div class="task-categories">
                    <button class="category-btn active" data-category="all">全部</button>
                    <button class="category-btn" data-category="pinned">置顶</button>
                    <button class="category-btn" data-category="备货">备货中</button>
                    <button class="category-btn" data-category="正在建">建设中</button>
                    <button class="category-btn" data-category="已完成">已完成</button>
                    <button class="category-btn" data-category="一笔未动">一笔未动</button>
                </div>
                
                <div id="tasks-list" class="tasks-grid">
                    <div class="loading" data-lang="common.loading">加载中...</div>
                </div>
            </div>
        </section>

        <section id="messages" class="messages-section">
            <div class="container">
                <h2 class="section-title" data-lang="home.messagesTitle">留言板</h2>
                
                <div id="message-form-container" class="message-form-container hidden">
                    <div class="message-form">
                        <textarea id="message-content" placeholder="写下你的留言..." maxlength="500"></textarea>
                        <button onclick="postMessage()" class="btn btn-primary">发布留言</button>
                    </div>
                </div>

                <div id="messages-list" class="messages-list">
                    <div class="loading">加载中...</div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>
                &copy; 2026 STC任务网站. All rights reserved. | 
                <a href="#" onclick="showTerms('service')">使用条款</a> | 
                <a href="#" onclick="showTerms('privacy')">隐私协议</a>
            </p>
            <p class="footer-note">使用本网站即表示您已阅读并同意服务条款与隐私协议</p>
        </div>
    </footer>

    <!-- 版权水印 -->
    <div class="copyright-watermark">© 2025-2026 STC 版权所有</div>

    <script src="js/main.js?v=18"></script>
    <script src="js/animations.js"></script>
    <script>
        function showTerms(type) {
            window.open('/terms.html?type=' + type, 'terms', 'width=800,height=600,scrollbars=yes,resizable=yes');
        }
    </script>
</body>
</html>
