<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STC - 申请邀请码</title>
    <script src="js/config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -30%;
            left: -30%;
            width: 160%;
            height: 160%;
            background: radial-gradient(circle at 30% 30%, rgba(102, 126, 234, 0.25) 0%, transparent 50%),
                        radial-gradient(circle at 70% 70%, rgba(118, 75, 162, 0.25) 0%, transparent 50%);
            z-index: -1;
        }

        .apply-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-container {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .title {
            font-size: 26px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.3);
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .apply-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .apply-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }

        .apply-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .info-box {
            background: rgba(102, 126, 234, 0.1);
            border: 1px solid rgba(102, 126, 234, 0.3);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .info-box p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            line-height: 1.6;
        }

        .info-box ul {
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            margin-top: 8px;
            padding-left: 20px;
        }

        .info-box li {
            margin-bottom: 4px;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 10px;
            padding: 12px 16px;
            color: #ef4444;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 10px;
            padding: 12px 16px;
            color: #10b981;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        /* 人机验证码 */
        .captcha-row {
            display: flex;
            gap: 10px;
            align-items: stretch;
        }

        .captcha-row .form-input {
            flex: 1;
        }

        .captcha-img {
            width: 120px;
            height: 50px;
            border-radius: 12px;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
            object-fit: cover;
            transition: all 0.3s;
        }

        .captcha-img:hover {
            border-color: #667eea;
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.3);
        }

        .captcha-hint {
            margin-top: 6px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-size: 13px;
            transition: color 0.3s;
        }

        .back-link a:hover {
            color: #667eea;
        }

        /* 确认弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-box {
            background: rgba(30, 30, 50, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 30px;
            max-width: 350px;
            text-align: center;
        }

        .modal-box h3 {
            color: #fff;
            font-size: 18px;
            margin-bottom: 15px;
        }

        .modal-box p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .modal-email {
            background: rgba(102, 126, 234, 0.2);
            border-radius: 8px;
            padding: 10px;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .modal-btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .modal-btn-confirm {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .modal-btn-confirm:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .modal-btn-cancel {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .modal-btn-cancel:hover {
            background: rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body>
    <div class="aurora-bg">
        <div class="aurora-blob aurora-blob-1"></div>
        <div class="aurora-blob aurora-blob-2"></div>
    </div>
    <div class="apply-container">
        <div class="glass-card">
            <div class="header">
                <div class="logo-container">✉️</div>
                <h1 class="title">申请邀请码</h1>
                <p class="subtitle">填写您的QQ邮箱申请注册邀请码</p>
            </div>

            <div id="error-message" class="error-message"></div>
            <div id="success-message" class="success-message"></div>

            <div class="info-box">
                <p>申请须知：</p>
                <ul>
                    <li>每个邮箱每天最多申请2次</li>
                    <li>管理员将在24小时内处理您的申请</li>
                    <li>批准后邀请码将发送至您的邮箱</li>
                </ul>
            </div>

            <form id="apply-form">
                <div class="form-group">
                    <label class="form-label">您的QQ邮箱</label>
                    <input type="email" class="form-input" id="email" name="email" placeholder="请输入QQ邮箱（如：123@qq.com）" required>
                </div>

                <div class="form-group">
                    <label class="form-label">人机验证</label>
                    <div class="captcha-row">
                        <input type="text" class="form-input" id="captcha-input" name="captcha" placeholder="请输入图形中的字符" maxlength="4" autocomplete="off" autocapitalize="off">
                        <img class="captcha-img" id="captcha-img" src="/api/captcha" alt="验证码" title="点击刷新" onclick="refreshCaptcha()">
                    </div>
                    <div class="captcha-hint">看不清？点击图片刷新</div>
                </div>

                <button type="submit" class="apply-btn" id="apply-btn">提交申请</button>
            </form>

            <div class="back-link">
                <a href="/register">← 返回注册页面</a>
            </div>
        </div>
    </div>

    <!-- 确认弹窗 -->
    <div class="modal-overlay" id="confirm-modal">
        <div class="modal-box">
            <h3>确认邮箱地址</h3>
            <p>请确认您的QQ邮箱填写正确，邀请码将发送到此邮箱</p>
            <div class="modal-email" id="modal-email-display"></div>
            <div class="modal-buttons">
                <button class="modal-btn modal-btn-cancel" onclick="closeModal()">取消</button>
                <button class="modal-btn modal-btn-confirm" onclick="confirmApply()">确认提交</button>
            </div>
        </div>
    </div>

    <script>
        let pendingEmail = '';

        // CSRF
        let _csrfCache = null;
        async function getCSRFTokenOnce() {
            try {
                const resp = await fetch('/api/csrf-token', { credentials: 'include' });
                if (resp.ok) {
                    const data = await resp.json();
                    _csrfCache = data.csrfToken;
                    return data.csrfToken;
                }
            } catch (e) { console.error('获取CSRF token失败:', e); }
            return null;
        }

        // 一次性 nonce（防重放）
        function genNonce() {
            return Date.now().toString(36) + Math.random().toString(16).slice(2, 10);
        }

        // 刷新人机验证码
        function refreshCaptcha() {
            const img = document.getElementById('captcha-img');
            img.src = '/api/captcha?t=' + Date.now();
        }

        // 检查是否是QQ邮箱
        function isQQEmail(email) {
            return /^[1-9][0-9]{4,10}@qq\.com$/i.test(email);
        }

        // 显示错误
        function showError(msg) {
            const el = document.getElementById('error-message');
            el.textContent = msg;
            el.classList.add('show');
            document.getElementById('success-message').classList.remove('show');
        }

        // 显示成功
        function showSuccess(msg) {
            const el = document.getElementById('success-message');
            el.textContent = msg;
            el.classList.add('show');
            document.getElementById('error-message').classList.remove('show');
        }

        // 打开确认弹窗
        function openModal(email) {
            pendingEmail = email;
            document.getElementById('modal-email-display').textContent = email;
            document.getElementById('confirm-modal').classList.add('show');
        }

        // 关闭弹窗
        function closeModal() {
            document.getElementById('confirm-modal').classList.remove('show');
            pendingEmail = '';
            document.getElementById('apply-btn').disabled = false;
            document.getElementById('apply-btn').textContent = '提交申请';
        }

        // 确认提交申请
        async function confirmApply() {
            const btn = document.getElementById('apply-btn');
            const captcha = document.getElementById('captcha-input').value.trim();
            
            try {
                const token = await getCSRFTokenOnce();
                const response = await fetch('/api/invite/request', {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json',
                        ...(token ? { 'X-CSRF-Token': token } : {}),
                        'X-Request-Nonce': genNonce()
                    },
                    body: JSON.stringify({ email: pendingEmail, captcha })
                });

                const data = await response.json();

                if (data.success) {
                    showSuccess('申请已提交！请等待管理员审核，结果将发送至您的邮箱。');
                    closeModal();
                } else {
                    // 验证码为单次使用，申请失败后刷新验证码
                    refreshCaptcha();
                    document.getElementById('captcha-input').value = '';
                    showError(data.message || '申请失败');
                    closeModal();
                }
            } catch (error) {
                showError('网络错误，请重试');
                closeModal();
            }
        }

        // 表单提交
        document.getElementById('apply-form').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const captcha = document.getElementById('captcha-input').value.trim();
            const btn = document.getElementById('apply-btn');
            
            if (!email) {
                showError('请输入邮箱地址');
                return;
            }

            if (!isQQEmail(email)) {
                showError('请输入正确的QQ邮箱格式（如：123456@qq.com）');
                return;
            }

            if (!captcha) {
                showError('请先输入人机验证码');
                return;
            }

            btn.disabled = true;
            btn.textContent = '处理中...';
            
            // 打开确认弹窗
            openModal(email);
        });
    </script>
    <script src="js/animations.js"></script>
</body>
</html>
