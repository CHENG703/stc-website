<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script src="/js/device-id.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STC - 用户登录</title>
    <script src="js/lang.js"></script>
    <script src="js/config.js"></script>
    <script src="js/bj-time.js?v=16"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            /* 背景改由 .page-bg 图层提供（见下方），此处只留兜底底色 */
            background: #05060a;
            display: flex;
            /* 靠右对齐：背景图的「無畏進歩」logo 居中，靠右能让左侧露出文字 */
            justify-content: flex-end;
            align-items: center;
            padding: 20px;
            padding-right: clamp(28px, 5vw, 80px);
            position: relative;
            overflow: hidden;
        }

        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3),
                        inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-container {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .title {
            font-size: 26px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            color: rgba(255, 255, 255, 0.8);
            font-size: 14px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            transition: all 0.3s;
            outline: none;
        }

        .form-input:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: #667eea;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
        }

        .form-input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            cursor: pointer;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #667eea;
            cursor: pointer;
        }

        .forgot-link {
            color: #667eea;
            font-size: 13px;
            text-decoration: none;
            transition: color 0.3s;
        }

        .forgot-link:hover {
            color: #764ba2;
        }

        .login-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .social-login {
            margin-top: 28px;
            text-align: center;
        }

        .social-login-text {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            margin-bottom: 16px;
        }

        .social-buttons {
            display: flex;
            gap: 12px;
        }

        .social-btn {
            flex: 1;
            padding: 12px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .social-btn.github:hover {
            border-color: #333;
            background: rgba(51, 51, 51, 0.3);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
        }

        .divider span {
            padding: 0 16px;
        }

        .register-link {
            text-align: center;
            margin-top: 24px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }

        .register-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .register-link a:hover {
            color: #764ba2;
        }

        .back-link {
            text-align: center;
            margin-top: 16px;
        }

        .back-link a {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-size: 13px;
            transition: color 0.3s;
        }

        .back-link a:hover {
            color: #667eea;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 10px;
            padding: 12px 16px;
            color: #ef4444;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }

        .error-message.show {
            display: block;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .success-message {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 10px;
            padding: 12px 16px;
            color: #10b981;
            font-size: 13px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .login-steps {
            margin-top: 16px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 12px 16px;
        }

        .step-item {
            display: flex;
            align-items: center;
            gap: 10px;
            color: rgba(255, 255, 255, 0.35);
            font-size: 13px;
            padding: 5px 0;
            transition: color 0.3s;
        }

        .step-item.active {
            color: #fff;
        }

        .step-item.done {
            color: #10b981;
        }

        .step-dot {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            flex-shrink: 0;
            transition: all 0.3s;
        }

        .step-item.active .step-dot {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            box-shadow: 0 0 12px rgba(102, 126, 234, 0.5);
            animation: stepPulse 1s ease-in-out infinite;
        }

        .step-item.done .step-dot {
            background: #10b981;
            color: #fff;
        }

        .step-item.done .step-dot::after {
            content: '✓';
        }

        @keyframes stepPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.12); }
        }

        .login-tabs {
            display: flex;
            margin-bottom: 24px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 4px;
        }

        .login-tab {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            border-radius: 10px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .login-tab.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .login-tab:hover:not(.active) {
            color: rgba(255, 255, 255, 0.8);
        }

        /* 图形验证码（登录人机验证） */
        .captcha-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .captcha-row .form-input {
            flex: 1;
            min-width: 0;
        }

        .captcha-img {
            width: 112px;
            height: 44px;
            border-radius: 8px;
            cursor: pointer;
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            object-fit: cover;
            flex-shrink: 0;
            display: block;
        }

        .captcha-tip {
            margin-top: 6px;
            font-size: 12px;
            color: #94a3b8;
        }

        /* 滑块人机验证弹窗（已停用，登录改用图形验证码） */
        .slider-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(2px);
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slider-modal {
            background: #fff;
            border-radius: 14px;
            width: min(420px, 92vw);
            padding: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
        }

        .slider-modal-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            font-weight: 600;
            color: #1e293b;
        }

        .slider-modal-close {
            border: none;
            background: transparent;
            font-size: 24px;
            line-height: 1;
            color: #94a3b8;
            cursor: pointer;
            padding: 0;
        }

        .slider-modal-close:hover {
            color: #334155;
        }

        .slider-modal-tip {
            font-size: 13px;
            color: #64748b;
            margin: 10px 0 16px;
        }

        .slider-track {
            position: relative;
            height: 44px;
            background: #e2e8f0;
            border-radius: 22px;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .slider-track.slider-track-ok {
            background: #d1fae5;
        }

        .slider-progress {
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 0;
            background: #c7d2fe;
            transition: width 0.1s linear;
            pointer-events: none;
        }

        .slider-track-ok .slider-progress {
            background: #a7f3d0;
        }

        .slider-hint {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: #94a3b8;
            z-index: 1;
            pointer-events: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .slider-thumb {
            position: absolute;
            left: 0;
            top: 0;
            width: 44px;
            height: 44px;
            background: #667eea;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            cursor: grab;
            z-index: 2;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.5);
            transition: left 0.1s linear;
        }

        .slider-thumb:active {
            cursor: grabbing;
        }

        .slider-thumb.slider-thumb-ok {
            background: #10b981;
        }

        .slider-msg {
            margin-top: 12px;
            font-size: 13px;
            color: #64748b;
            text-align: center;
            min-height: 18px;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 640px) {
            body {
                justify-content: center;
                padding-right: 20px;
            }
        }

        @media (max-width: 480px) {
            .glass-card {
                padding: 28px 20px;
            }

            .title {
                font-size: 22px;
            }
        }

        /* ===== 背景图 + 毛玻璃 ===== */
        .page-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background: #05060a url('/bg-hero.jpg') center center / cover no-repeat;
        }

        .page-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(5, 6, 10, 0.25) 0%, rgba(5, 6, 10, 0.6) 100%);
        }

        /* 主卡片：毛玻璃（覆盖上面的基础样式） */
        .glass-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45),
                        inset 0 1px 1px rgba(255, 255, 255, 0.12);
        }

        /* 卡片内的次级模块：半透明玻璃感（不再叠加 backdrop-filter，省 GPU） */
        .form-input,
        .login-tabs,
        .login-steps {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.14);
        }

        .form-input:focus {
            background: rgba(255, 255, 255, 0.11);
        }

        /* 登录步骤面板：独立成块，单独毛玻璃 */
        .login-steps {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        /* ===== OTP Deck：输码（一手牌展开 → 收拢核验 → 印章 / 失败抖动） ===== */
        .otp-deck {
            --slot: 48px; --gap: 8px;
            position: relative; width: 100%; height: 84px; margin: 6px 0 4px;
            display: block;
        }
        .otp-slot {
            position: absolute; left: 50%; top: 0; margin-left: calc(var(--slot) / -2);
            width: var(--slot); height: var(--slot); border-radius: 14px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.14);
            display: flex; align-items: center; justify-content: center;
            font-size: 28px; font-weight: 700; color: var(--text-primary, #f1f5f9);
            font-family: 'JetBrains Mono','SF Mono','Menlo','Consolas',monospace;
            cursor: text; transform-origin: 50% 320%; user-select: none;
            transition: background .2s ease, border-color .2s ease, box-shadow .2s ease, color .2s ease,
                        transform .36s cubic-bezier(.2,.7,.2,1);
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
        }
        .otp-slot[data-i="0"] { transform: translate(calc(-2.5 * (var(--slot) + var(--gap))), 0); }
        .otp-slot[data-i="1"] { transform: translate(calc(-1.5 * (var(--slot) + var(--gap))), 0); }
        .otp-slot[data-i="2"] { transform: translate(calc(-0.5 * (var(--slot) + var(--gap))), 0); }
        .otp-slot[data-i="3"] { transform: translate(calc( 0.5 * (var(--slot) + var(--gap))), 0); }
        .otp-slot[data-i="4"] { transform: translate(calc( 1.5 * (var(--slot) + var(--gap))), 0); }
        .otp-slot[data-i="5"] { transform: translate(calc( 2.5 * (var(--slot) + var(--gap))), 0); }
        .otp-slot.is-filled { background: rgba(74,158,255,0.12); border-color: rgba(74,158,255,0.45); }
        .otp-slot.is-focused { border-color: #4a9eff; box-shadow: 0 0 0 3px rgba(74,158,255,0.22), 0 0 20px rgba(74,158,255,0.35); }
        .otp-slot.is-error { border-color: #ff6b6b !important; box-shadow: 0 0 0 3px rgba(255,107,107,0.25); animation: otp-flash .6s ease; }
        @keyframes otp-flash {
            0%, 100% { background: rgba(255,107,107,0.05); }
            50%      { background: rgba(255,107,107,0.20); }
        }
        .otp-deck.is-shake { animation: otp-shake-deck .42s ease; }
        @keyframes otp-shake-deck {
            10%, 90% { transform: translateX(-4px); }
            20%, 80% { transform: translateX( 4px); }
            30%, 50%, 70% { transform: translateX(-7px); }
            40%, 60% { transform: translateX( 7px); }
        }
        .otp-deck-input {
            position: absolute; left: 0; top: 0; width: 100%; height: 100%;
            opacity: 0; background: transparent; border: 0; outline: 0;
            caret-color: transparent; color: transparent; font-size: 16px;
            z-index: 2; cursor: text; letter-spacing: 0;
        }
        .otp-hint { margin-top: 6px; font-size: 12px; color: rgba(241,245,249,0.55); display: flex; gap: 8px; align-items: center; }
        .otp-hint kbd { font-family: inherit; font-size: 11px; padding: 1px 6px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.05); }

        /* ===== 验证码登录：两步（① 邮箱 + 人机验证 → ② 输码自动登录） ===== */
        .step-tip { font-size: 12px; color: rgba(241,245,249,0.5); margin-top: 8px; line-height: 1.6; }
        .step-back {
            display: inline-flex; align-items: center; gap: 6px;
            background: transparent; border: 0; padding: 0; margin-bottom: 14px;
            color: rgba(241,245,249,0.6); font-size: 13px; cursor: pointer; transition: color .3s;
        }
        .step-back:hover { color: #fff; }
        .otp-head { margin-bottom: 16px; }
        .otp-title { font-size: 20px; font-weight: 700; color: #fff; }
        .otp-sub { margin-top: 6px; font-size: 13px; color: rgba(241,245,249,0.6); line-height: 1.6; word-break: break-all; }
        .otp-sub b { color: #4a9eff; font-weight: 600; }
        .otp-resend { display: flex; align-items: center; gap: 6px; margin-top: 12px; font-size: 13px; color: rgba(241,245,249,0.55); }
        .link-btn { background: transparent; border: 0; padding: 0; color: #4a9eff; font-size: 13px; cursor: pointer; }
        .link-btn:hover:not(:disabled) { text-decoration: underline; }
        .link-btn:disabled { color: rgba(241,245,249,0.35); cursor: not-allowed; }
        .step-in { animation: step-in .32s cubic-bezier(.2,.7,.2,1) both; }
        @keyframes step-in {
            from { opacity: 0; transform: translateX(14px); }
            to   { opacity: 1; transform: none; }
        }

        /* 验证中：六张牌收拢成一叠 + 蓝色发光脉冲（参考视频的「Checking your code」） */
        .otp-deck.is-checking .otp-slot {
            transform: translate(0, 0);
            background: rgba(74,158,255,0.10);
            border-color: rgba(74,158,255,0.5);
            animation: otp-glow 1.1s ease-in-out infinite;
        }
        @keyframes otp-glow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(74,158,255,0); }
            50%      { box-shadow: 0 0 22px 4px rgba(74,158,255,0.35); }
        }
        /* 验证成功：绿色印章 */
        .otp-deck.is-verified .otp-slot {
            transform: translate(0, 0);
            background: rgba(16,185,129,0.14);
            border-color: rgba(16,185,129,0.65);
            color: #34d399;
            box-shadow: 0 0 22px rgba(16,185,129,0.35);
        }
        @media (max-width: 480px) {
            .otp-deck { --slot: 40px; --gap: 6px; height: 72px; }
            .otp-slot { font-size: 20px; border-radius: 12px; }
        }
    </style>
</head>
<body>
    <div class="page-bg" aria-hidden="true"></div>
    <div class="login-container">
        <div class="glass-card">
            <div class="header">
                <div class="logo-container">🔐</div>
                <h1 class="title" data-lang="login.title">欢迎回来</h1>
                <p class="subtitle" data-lang="login.subtitle">登录到 STC 任务平台</p>
            </div>

            <div id="error-message" class="error-message"></div>
            <div id="success-message" class="success-message"></div>

            <div class="login-tabs">
                <button type="button" class="login-tab" id="tab-password" onclick="switchLoginTab('password')" data-lang="login.passwordLogin">密码登录</button>
                <button type="button" class="login-tab active" id="tab-code" onclick="switchLoginTab('code')" data-lang="login.codeLogin">验证码登录</button>
            </div>

            <form id="login-form">
                <!-- 密码登录（默认隐藏：优先验证码登录） -->
                <div id="password-login" class="hidden">
                    <div class="form-group">
                        <label class="form-label" data-lang="login.username">用户名或邮箱</label>
                        <input type="text" class="form-input" id="username" name="username" placeholder="请输入用户名或邮箱" data-lang-placeholder="login.username">
                    </div>

                    <div class="form-group">
                        <label class="form-label" data-lang="login.password">密码</label>
                        <input type="password" class="form-input" id="password" name="password" placeholder="请输入密码" data-lang-placeholder="login.password">
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox" id="remember" name="remember">
                            <span>记住我</span>
                        </label>
                        <a href="#" class="forgot-link" data-lang="login.forgotPassword">忘记密码？</a>
                    </div>
                </div>

                <!-- 验证码登录：第 1 步（邮箱） -->
                <div id="code-login">
                    <div id="code-step-1">
                        <div class="form-group">
                            <label class="form-label" data-lang="login.email">邮箱</label>
                            <input type="email" class="form-input" id="login-email" name="email" placeholder="请输入注册的邮箱" data-lang-placeholder="login.email">
                        </div>
                        <div class="step-tip" id="code-step1-tip">填好邮箱和人机验证码后点「发送验证码」，验证码会发到你的邮箱（5 分钟内有效）。</div>
                    </div>

                    <!-- 验证码登录：第 2 步（输码 → 自动登录） -->
                    <div id="code-step-2" class="hidden">
                        <button type="button" class="step-back" id="code-back">← 更换邮箱</button>
                        <div class="otp-head">
                            <div class="otp-title" id="otp-title">输入验证码</div>
                            <div class="otp-sub"><span id="otp-sub-text">验证码已发送至</span> <b id="otp-email"></b></div>
                        </div>
                        <div class="otp-deck" id="otp-deck" data-length="6" aria-label="一次性验证码">
                            <span class="otp-slot" data-i="0"><span class="otp-slot__digit"></span></span>
                            <span class="otp-slot" data-i="1"><span class="otp-slot__digit"></span></span>
                            <span class="otp-slot" data-i="2"><span class="otp-slot__digit"></span></span>
                            <span class="otp-slot" data-i="3"><span class="otp-slot__digit"></span></span>
                            <span class="otp-slot" data-i="4"><span class="otp-slot__digit"></span></span>
                            <span class="otp-slot" data-i="5"><span class="otp-slot__digit"></span></span>
                            <input type="text" class="otp-deck-input" id="otp-input"
                                   inputmode="text" autocomplete="one-time-code"
                                   autocapitalize="characters" autocorrect="off" spellcheck="false"
                                   maxlength="6" aria-label="一次性验证码">
                        </div>
                        <div class="otp-hint">
                            <span>支持直接粘贴 · 输满 6 位自动登录</span>
                        </div>
                        <div class="otp-resend">
                            <span>没收到？</span>
                            <button type="button" class="link-btn" id="resend-code">重新发送</button>
                        </div>
                        <!-- 兼容现有提交逻辑：deck 把数字写到这个隐藏字段 -->
                        <input type="hidden" id="login-code" name="code" value="">
                    </div>
                </div>

                <!-- 人机验证（图形验证码）：只在验证码登录第 1 步（发码）使用 -->
                <div class="form-group" id="captcha-group">
                    <label class="form-label">人机验证</label>
                    <div class="captcha-row">
                        <input type="text" class="form-input" id="captcha-input" maxlength="6" placeholder="请输入图中字符" autocomplete="off">
                        <img id="captcha-img" class="captcha-img" alt="验证码" title="点击刷新验证码" onclick="refreshCaptcha()">
                    </div>
                    <div class="captcha-tip">看不清？点击图片可刷新</div>
                </div>

                <!-- 验证码登录第 1 步的主按钮（发送验证码） -->
                <button type="button" class="login-btn" id="send-login-code" data-lang="login.sendCode">发送验证码</button>

                <button type="submit" class="login-btn hidden" id="login-btn">登 录</button>

                <!-- 登录步骤提示 -->
                <div id="login-steps" class="login-steps hidden">
                    <div class="step-item" id="step-connect">
                        <span class="step-dot">1</span>
                        <span>正在连接服务器...</span>
                    </div>
                    <div class="step-item" id="step-verify">
                        <span class="step-dot">2</span>
                        <span>正在校验登录信息...</span>
                    </div>
                    <div class="step-item" id="step-token">
                        <span class="step-dot">3</span>
                        <span>正在校验身份令牌...</span>
                    </div>
                    <div class="step-item" id="step-redirect">
                        <span class="step-dot">4</span>
                        <span>登录成功，正在跳转...</span>
                    </div>
                </div>
            </form>

            <div class="divider">
                <span>或</span>
            </div>

            <button type="button" class="login-btn" id="logto-btn" style="background: #4a9eff; margin-top: 10px;" onclick="window.location.href='/logto/sign-in'">
                Logto 登录
            </button>

            <div class="register-link">
                还没有账号？ <a href="/register">立即注册</a>
            </div>

            <div class="back-link">
                <a href="/">← 返回首页</a>
            </div>
        </div>
    </div>

    <script>
        let currentLoginType = 'code'; // 默认优先「验证码登录」
        let codeTimer = null;
        let _csrfToken = null;

        // 获取一次性 CSRF Token
        async function getCsrfToken() {
            try {
                const resp = await fetch('/api/csrf-token', { credentials: 'include' });
                if (resp.ok) {
                    const data = await resp.json();
                    _csrfToken = data.csrfToken;
                    return data.csrfToken;
                }
            } catch (e) {}
            return null;
        }

        // 生成请求 nonce
        function genNonce() {
            return Date.now().toString(36) + Math.random().toString(16).slice(2, 10);
        }

        // ============ 滑块人机验证（已停用：登录已改用图形验证码，保留旧实现备用） ============
        let sliderBusy = false;   // 防止重复弹出
        let sliderResolve = null; // openSlider 的 Promise resolve
        let sliderState = 'idle'; // idle | dragging | loading | success

        function sliderEl(id) {
            return document.getElementById(id);
        }

        function setSliderMsg(text, isError) {
            const m = sliderEl('slider-msg');
            if (!m) return;
            m.textContent = text || '';
            m.style.color = isError ? '#dc2626' : '#10b981';
        }

        function resetSliderUI() {
            const track = sliderEl('slider-track');
            const thumb = sliderEl('slider-thumb');
            const prog = sliderEl('slider-progress');
            const hint = sliderEl('slider-hint');
            if (thumb) {
                thumb.style.left = '0px';
                thumb.style.transition = '';
                thumb.textContent = '→';
                thumb.classList.remove('slider-thumb-ok');
            }
            if (prog) prog.style.width = '0%';
            if (track) track.classList.remove('slider-track-ok');
            if (hint) {
                hint.style.visibility = 'visible';
                hint.textContent = '按住滑块，拖动到最右侧';
            }
            setSliderMsg('');
        }

        // 打开滑块弹窗，返回 Promise：验证通过 resolve(true)，关闭/取消 resolve(false)
        function openSlider() {
            resetSliderUI();
            sliderState = 'idle';
            const overlay = sliderEl('slider-overlay');
            if (overlay) overlay.style.display = 'flex';
            return new Promise(resolve => {
                sliderResolve = resolve;
            });
        }

        function closeSlider(ok) {
            const overlay = sliderEl('slider-overlay');
            if (overlay) overlay.style.display = 'none';
            if (sliderResolve) {
                const r = sliderResolve;
                sliderResolve = null;
                r(ok);
            }
        }

        // 拖动成功后上报服务端，换取当前会话一次性"solved"标记。
        // points: 拖动全程采样点 [{x,y,t}]，供服务端做轨迹噪声/回退/节奏分析
        async function submitSliderPass(startTime, moveCount, trail, target) {
            try {
                const elapsed = Date.now() - startTime;
                const points = (Array.isArray(trail) && trail.length >= 3)
                    ? trail.slice(0, 3000)
                    : null;
                const response = await fetch('/api/captcha/slide', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ elapsed, steps: moveCount, points, target: target || 0 })
                });
                if (!response.ok) return false;
                const data = await response.json();
                return !!data.success;
            } catch (e) {
                return false;
            }
        }

        function initSlider() {
            const overlay = sliderEl('slider-overlay');
            const track = sliderEl('slider-track');
            const thumb = sliderEl('slider-thumb');
            if (!overlay || !track || !thumb) return;

            let dragging = false;
            let startClientX = 0;
            let startLeft = 0;
            let startTime = 0;
            let moveCount = 0;
            let startRect = null;      // 轨道相对视口位置（轨迹坐标换算基准）
            let trail = [];            // 拖动采样点 [{x, y, t}]，t 为相对起点 ms

            const maxX = () => Math.max(0, track.clientWidth - thumb.offsetWidth);

            const setLeft = (x) => {
                thumb.style.left = x + 'px';
                const prog = sliderEl('slider-progress');
                if (prog) prog.style.width = Math.round(x / maxX() * 100) + '%';
            };

            thumb.addEventListener('pointerdown', (e) => {
                if (sliderState !== 'idle') return;
                e.preventDefault();
                dragging = true;
                sliderState = 'dragging';
                startClientX = e.clientX;
                startLeft = thumb.offsetLeft;
                startTime = Date.now();
                moveCount = 0;
                startRect = track.getBoundingClientRect();
                trail = [{ x: e.clientX - startRect.left, y: e.clientY - startRect.top, t: 0 }];
                thumb.style.transition = 'none'; // 拖动过程不延迟
                const hint = sliderEl('slider-hint');
                if (hint) hint.style.visibility = 'hidden';
                setSliderMsg('');
                try { thumb.setPointerCapture(e.pointerId); } catch (err) {}
            });

            thumb.addEventListener('pointermove', (e) => {
                if (!dragging) return;
                moveCount++;
                let x = startLeft + (e.clientX - startClientX);
                x = Math.max(0, Math.min(maxX(), x));
                setLeft(x);
                // 记录真实指针轨迹（相对轨道坐标），供服务端做抖动/回退分析
                if (startRect) {
                    trail.push({
                        x: e.clientX - startRect.left,
                        y: e.clientY - startRect.top,
                        t: Date.now() - startTime
                    });
                    if (trail.length > 4000) trail.splice(0, trail.length - 3000);
                }
            });

            const endDrag = () => {
                if (!dragging) return;
                dragging = false;
                thumb.style.transition = '';
                if (thumb.offsetLeft >= maxX() - 1) {
                    // 到达最右端：上报服务端换取一次性通过标记
                    sliderState = 'loading';
                    setSliderMsg('正在验证...');
                    const sTime = startTime;
                    const sMoves = moveCount;
                    const sTrail = trail.slice(0, 3000);
                    const sTarget = maxX();
                    submitSliderPass(sTime, sMoves, sTrail, sTarget).then(ok => {
                        if (ok) {
                            sliderState = 'success';
                            track.classList.add('slider-track-ok');
                            thumb.classList.add('slider-thumb-ok');
                            thumb.textContent = '✓';
                            setSliderMsg('验证通过');
                            setTimeout(() => closeSlider(true), 350);
                        } else {
                            sliderState = 'idle';
                            resetSliderUI();
                            setSliderMsg('验证失败，请重试', true);
                        }
                    }).catch(() => {
                        sliderState = 'idle';
                        resetSliderUI();
                        setSliderMsg('网络异常，请重试', true);
                    });
                } else {
                    // 未拖到最右端：自动回弹
                    sliderState = 'idle';
                    thumb.style.transition = 'left 0.25s ease';
                    resetSliderUI();
                    setSliderMsg('请将滑块拖到最右侧', true);
                }
            };
            thumb.addEventListener('pointerup', endDrag);
            thumb.addEventListener('pointercancel', endDrag);

            // 点击遮罩区域或右上角关闭 = 取消验证
            overlay.addEventListener('pointerdown', (e) => {
                if (e.target === overlay) closeSlider(false);
            });
            const closeBtn = sliderEl('slider-close');
            if (closeBtn) closeBtn.addEventListener('click', () => closeSlider(false));
        }

        initSlider();

        // ============ 图形验证码（人机验证） ============
        // 只在「验证码登录第 1 步 → 发送验证码」用到，按需加载，密码登录不再白拉一张图
        function ensureCaptcha() {
            const img = document.getElementById('captcha-img');
            if (img && !img.getAttribute('src')) refreshCaptcha();
        }

        function refreshCaptcha() {
            const img = document.getElementById('captcha-img');
            if (img) img.src = '/api/captcha?t=' + Date.now();
        }

        function getCaptchaValue() {
            const el = document.getElementById('captcha-input');
            return el ? el.value.trim() : '';
        }

        // 验证码单次有效：提交失败后需清空并换一张
        function resetCaptcha() {
            const el = document.getElementById('captcha-input');
            if (el) el.value = '';
            refreshCaptcha();
        }

        // 图形验证码按需加载：只有当界面停在「验证码登录第 1 步」时才拉（见 updateAuthChrome() → ensureCaptcha()）

        // 检查URL参数
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        const message = urlParams.get('message');

        if (error) {
            const errorEl = document.getElementById('error-message');
            errorEl.textContent = decodeURIComponent(error);
            errorEl.classList.add('show');
        }

        if (message) {
            const successEl = document.getElementById('success-message');
            successEl.textContent = decodeURIComponent(message);
            successEl.classList.add('show');
            setTimeout(() => {
                successEl.classList.remove('show');
            }, 5000);
        }

        // ===== 验证码登录分两步：1 = 邮箱 + 人机验证，2 = 输入验证码（输满自动登录） =====
        let codeStep = 1;
        let codeSent = false;
        const STEP1_TIP = '填好邮箱和人机验证码后点「发送验证码」，验证码会发到你的邮箱（5 分钟内有效）。';

        // 按「当前 tab + 当前步骤」决定各控件的显隐
        function updateAuthChrome() {
            const isCode = currentLoginType === 'code';
            const needCaptcha = isCode && codeStep === 1; // 只有「验证码登录第 1 步（发码）」要人机验证
            document.getElementById('captcha-group').classList.toggle('hidden', !needCaptcha);
            document.getElementById('send-login-code').classList.toggle('hidden', !needCaptcha);
            document.getElementById('login-btn').classList.toggle('hidden', isCode && codeStep === 1);
            if (needCaptcha && typeof ensureCaptcha === 'function') ensureCaptcha();
        }

        // 切换到验证码登录的第 n 步
        function showCodeStep(n) {
            codeStep = n;
            const step1 = document.getElementById('code-step-1');
            const step2 = document.getElementById('code-step-2');
            step1.classList.toggle('hidden', n !== 1);
            step2.classList.toggle('hidden', n !== 2);
            const el = n === 1 ? step1 : step2;
            el.classList.remove('step-in');
            void el.offsetWidth; // 强制重排，让入场动画能重播
            el.classList.add('step-in');
            updateAuthChrome();
            if (n === 2 && typeof window.otpDeckFocus === 'function') {
                setTimeout(() => window.otpDeckFocus(), 60);
            }
        }

        // 输码这一步的标题 / 副标题
        function setOtpHead(title, subText, email) {
            document.getElementById('otp-title').textContent = title;
            document.getElementById('otp-sub-text').textContent = subText;
            document.getElementById('otp-email').textContent = email || '';
        }

        // 核验失败后把输码这一步复位
        function resetOtpStep() {
            setOtpHead('输入验证码', '验证码已发送至', document.getElementById('login-email').value.trim());
            if (typeof window.otpDeckReset === 'function') window.otpDeckReset();
        }

        // 回到第 1 步（换邮箱 / 重发都要重新过人机验证——图形码是单次有效的）
        function backToStep1(tip) {
            hideMessages();
            codeSent = false;
            clearInterval(codeTimer);
            const rb = document.getElementById('resend-code');
            if (rb) { rb.disabled = false; rb.textContent = '重新发送'; }
            document.getElementById('code-step1-tip').textContent = tip || STEP1_TIP;
            showCodeStep(1);
            resetCaptcha();
            const emailInput = document.getElementById('login-email');
            try { emailInput.focus({ preventScroll: true }); } catch (_) { emailInput.focus(); }
        }

        // 切换登录方式
        function switchLoginTab(type) {
            currentLoginType = type;
            document.getElementById('tab-password').classList.toggle('active', type === 'password');
            document.getElementById('tab-code').classList.toggle('active', type === 'code');
            document.getElementById('password-login').classList.toggle('hidden', type !== 'password');
            document.getElementById('code-login').classList.toggle('hidden', type !== 'code');
            hideMessages();
            if (type === 'code') {
                // 已经发过码就直接回到输码那一步，不必重复发送
                showCodeStep(codeSent ? 2 : 1);
            } else {
                codeStep = 1;
                updateAuthChrome();
            }
        }

        // 发送登录验证码：成功后跳到第 2 步（输码）
        document.getElementById('send-login-code').addEventListener('click', async function() {
            const email = document.getElementById('login-email').value.trim();
            const btn = this;
            const btnLabel = btn.textContent || '发送验证码';

            if (!email) {
                showError('请先输入邮箱地址');
                return;
            }

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showError('请输入有效的邮箱地址');
                return;
            }

            // 人机验证（图形验证码）
            const captcha = getCaptchaValue();
            if (!captcha) {
                showError('请输入人机验证码');
                return;
            }

            hideMessages();
            btn.disabled = true;
            btn.textContent = '发送中...';

            try {
                const csrf = await getCsrfToken();
                const nonce = genNonce();
                const response = await fetch('/api/send-code', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        ...(csrf ? { 'X-CSRF-Token': csrf } : {}),
                        'X-Request-Nonce': nonce
                    },
                    body: JSON.stringify({ email, type: 'login', captcha })
                });
                // 先检查是否是 JSON 响应
                const ct = response.headers.get('content-type') || '';
                if (!ct.includes('application/json')) {
                    const text = await response.text();
                    throw new Error('服务器返回非JSON响应 (HTTP ' + response.status + '): ' + text.substring(0, 200));
                }
                const data = await response.json();
                if (data.success) {
                    codeSent = true;
                    document.getElementById('code-step1-tip').textContent = STEP1_TIP;
                    setOtpHead('输入验证码', '验证码已发送至', email);
                    startResendCountdown(60);
                    resetCaptcha();     // 图形验证码已被这次请求消耗，换一张备用
                    showCodeStep(2);    // ← 跳到「输入验证码」那一步
                    showSuccess('验证码已发送到您的邮箱');
                } else {
                    // 图形验证码单次有效：失败后需清空并换一张
                    showError(data.message || '发送验证码失败');
                    resetCaptcha();
                }
            } catch (error) {
                showError('网络错误: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.textContent = btnLabel;
            }
        });

        // 「重新发送」倒计时（对齐服务端 60 秒冷却）
        function startResendCountdown(sec) {
            const btn = document.getElementById('resend-code');
            if (!btn) return;
            let n = sec;
            clearInterval(codeTimer);
            btn.disabled = true;
            btn.textContent = '重新发送 (' + n + 's)';
            codeTimer = setInterval(() => {
                n--;
                if (n <= 0) {
                    clearInterval(codeTimer);
                    btn.disabled = false;
                    btn.textContent = '重新发送';
                } else {
                    btn.textContent = '重新发送 (' + n + 's)';
                }
            }, 1000);
        }

        // 换邮箱 / 重新发送：都回到第 1 步重新过人机验证
        document.getElementById('code-back').addEventListener('click', () => backToStep1(STEP1_TIP));
        document.getElementById('resend-code').addEventListener('click', () => backToStep1('人机验证码已使用，请重新输入后再发送。'));

        // 登录步骤控制
        function showLoginSteps() {
            document.getElementById('login-steps').classList.remove('hidden');
        }

        function hideLoginSteps() {
            document.getElementById('login-steps').classList.add('hidden');
        }

        // 点亮第 n 步（1-4），之前的步骤标记为已完成
        function setLoginStep(n) {
            const steps = ['step-connect', 'step-verify', 'step-token', 'step-redirect'];
            steps.forEach((id, i) => {
                const el = document.getElementById(id);
                el.classList.remove('active', 'done');
                if (i < n - 1) el.classList.add('done');
                else if (i === n - 1) el.classList.add('active');
            });
        }

        // 提交登录（密码登录 / 邮箱验证码登录共用）
        async function submitLogin(payload) {
            const btn = document.getElementById('login-btn');
            const isCode = payload.loginType === 'code';

            hideMessages();
            hideLoginSteps();
            btn.disabled = true;
            btn.textContent = '登录中...';
            // 验证码登录的进度由 deck 自己的动效表达，不再叠一遍四步提示
            if (!isCode) {
                showLoginSteps();
                setLoginStep(1); // 正在连接服务器
                setLoginStep(2); // 正在校验登录信息
            }

            // 失败统一收尾：提示 + 复位输入
            const fail = (msg) => {
                showError(msg);
                hideLoginSteps();
                btn.disabled = false;
                btn.textContent = '登 录';
                if (isCode) {
                    resetOtpStep();
                    try { if (typeof window.otpDeckShake === 'function') window.otpDeckShake(); } catch (_) {}
                }
            };

            try {
                const csrf = await getCsrfToken();
                const nonce = genNonce();
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        ...(csrf ? { 'X-CSRF-Token': csrf } : {}),
                        'X-Request-Nonce': nonce
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                // 处理网站锁定
                if (response.status === 503 && data.locked) {
                    showSiteLockedModal(data.lockBy, data.lockReason);
                    btn.disabled = false;
                    btn.textContent = '登 录';
                    hideLoginSteps();
                    if (isCode) resetOtpStep();
                    return;
                }

                if (data.success) {
                    // 登录态由服务端写入 httpOnly cookie（前端不接触 token，XSS 也偷不走）；
                    // 跨域部署（GitHub Pages 镜像）可能拿不到第三方 cookie，
                    // 此时服务端会在响应体里回 token，交给 config.js 的跨域登录态兜底
                    if (window.STCAPI) STCAPI.setToken(data.token);
                    showSuccess('登录成功！正在跳转...');
                    if (isCode) {
                        // 参考视频的确认动效：一叠牌发光 → 绿色印章 +「验证成功」
                        setOtpHead('验证成功', '正在跳转…', '');
                        if (typeof window.otpDeckSuccess === 'function') window.otpDeckSuccess();
                        setTimeout(() => { window.location.href = '/home'; }, 900);
                    } else {
                        setLoginStep(3); // 正在校验身份令牌
                        // 登录态走 httpOnly cookie，响应体不再回 token，直接看 success 即可
                        if (data.success) setLoginStep(4); // 登录成功，正在跳转
                        setTimeout(() => { window.location.href = '/home'; }, 600);
                    }
                    return; // 成功后保持按钮禁用，等跳转
                }

                fail(data.message || '登录失败');
            } catch (error) {
                fail('网络错误，请重试');
            }
        }

        // 邮箱验证码登录：发码时已做过人机验证，这里只校验邮箱验证码
        let codeLoginBusy = false;
        function submitCodeLogin() {
            if (codeLoginBusy) return;
            const email = document.getElementById('login-email').value.trim();
            const code = (document.getElementById('login-code').value || '').trim();

            if (!email) {
                showError('请先输入邮箱');
                showCodeStep(1);
                return;
            }
            if (code.length < 6) {
                showError('请输入完整的 6 位验证码');
                return;
            }

            codeLoginBusy = true;
            // 输码 → 核验中的过渡（对应参考视频的 Checking your code）
            setOtpHead('正在验证验证码', '正在确认，请稍候…', '');
            if (typeof window.otpDeckChecking === 'function') window.otpDeckChecking();
            Promise.resolve(submitLogin({ loginType: 'code', email, code }))
                .then(() => { codeLoginBusy = false; })
                .catch(() => { codeLoginBusy = false; });
        }

        // deck 输满 6 位 → 等扇形展开动画播完再自动提交
        window.onOtpComplete = function() {
            setTimeout(submitCodeLogin, 680);
        };

        // 登录表单提交
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();

            // 验证码登录：第 1 步回车 = 发送验证码，第 2 步回车 = 核验登录
            if (currentLoginType === 'code') {
                if (codeStep === 1) document.getElementById('send-login-code').click();
                else submitCodeLogin();
                return;
            }

            // 密码登录
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;

            if (!username || !password) {
                showError('请填写用户名和密码');
                return;
            }

            // 密码登录同样不再要求人机验证
            // （防爆破：IP 限流 1 分钟 5 次 + 账号连续 3 次密码错误锁定 5 分钟）
            submitLogin({ loginType: 'password', username, password, remember });
        });

        // 初始化：默认进「验证码登录」第 1 步（同时会按需加载图形验证码）
        switchLoginTab('code');

        // 显示网站锁定弹窗
        function showSiteLockedModal(lockBy, lockReason) {
            const existingModal = document.getElementById('site-locked-modal');
            if (existingModal) existingModal.remove();
            
            const modal = document.createElement('div');
            modal.id = 'site-locked-modal';
            modal.innerHTML = `
                <div style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:99999;display:flex;align-items:center;justify-content:center;">
                    <div style="background:#1a1a2e;padding:30px;border-radius:15px;max-width:400px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,0.5);">
                        <div style="font-size:50px;margin-bottom:20px;">🔒</div>
                        <h2 style="color:#ff6b6b;margin-bottom:15px;">网站已锁定</h2>
                        <p style="color:#eee;margin-bottom:10px;">网站暂时无法登录</p>
                        <div style="background:rgba(255,107,107,0.1);padding:15px;border-radius:8px;margin:15px 0;">
                            <p style="color:#ffa502;margin:5px 0;"><strong>锁定者:</strong> ${lockBy}</p>
                            <p style="color:#ffa502;margin:5px 0;"><strong>原因:</strong> ${lockReason}</p>
                        </div>
                        <p style="color:#888;font-size:12px;">请稍后再试或联系管理员</p>
                        <button onclick="document.getElementById('site-locked-modal').remove()" style="margin-top:20px;padding:10px 30px;background:#4a9eff;border:none;border-radius:8px;color:#fff;cursor:pointer;font-size:14px;">关闭</button>
                    </div>
                </div>
            `;
            document.body.appendChild(modal);
        }

        function showError(msg) {
            const el = document.getElementById('error-message');
            el.textContent = msg;
            el.classList.add('show');
        }

        function showSuccess(msg) {
            const el = document.getElementById('success-message');
            el.textContent = msg;
            el.classList.add('show');
        }

        function hideMessages() {
            document.getElementById('error-message').classList.remove('show');
            document.getElementById('success-message').classList.remove('show');
        }
    </script>

    <script src="js/animations.js"></script>
    <!-- 登录页背景音乐（自动循环播放，左下角可静音） -->
    <script src="js/login-bgm.js?v=2"></script>

    <script>
    // ============ OTP Deck：验证码登录栏的「一手牌」输入组件 ============
    (function(){
        const deck = document.getElementById('otp-deck');
        if (!deck) return;
        const N = parseInt(deck.dataset.length || '6', 10);
        const slots = Array.from(deck.querySelectorAll('.otp-slot'));
        const real  = document.getElementById('otp-input');
        const hidden = document.getElementById('login-code');

        function paint(v){
            // 后端 /api/send-code 生成的是 0-9A-Z 的 6 位码，统一转大写并去掉空白/连字符
            v = (v || '').replace(/[\s-]/g, '').toUpperCase().slice(0, N);
            real.value = v;
            hidden.value = v;
            slots.forEach((s, i) => {
                const ch = v[i] || '';
                const d = s.firstElementChild;
                if (d) d.textContent = ch;
                s.classList.toggle('is-filled', !!ch);
            });
            const fi = Math.min(v.length, N - 1);
            slots.forEach((s, i) => s.classList.toggle('is-focused', i === fi && v.length < N));
            return v.length === N;
        }

        function cancelAll(){
            slots.forEach(s => { try { s.getAnimations().forEach(a => a.cancel()); } catch(_){} });
        }

        // 「一手牌」：所有 slot 共享一个旋转支点（transform-origin 50% 320%），
        // 全部填完时把每张牌从自己的横排位置旋到中心并倾斜，形成扇形。
        function spread(){
            const range = 34, step = N > 1 ? range / (N - 1) : 0, start = -range / 2;
            slots.forEach((s, i) => {
                const from = getComputedStyle(s).transform;
                s.animate(
                    [{ transform: from }, { transform: `translate(0px, 0px) rotate(${(start + step * i).toFixed(2)}deg)` }],
                    { duration: 560, delay: i * 45, fill: 'forwards', easing: 'cubic-bezier(.2,.7,.2,1)' }
                );
            });
        }

        function resetDeck(){
            cancelAll();
            deck.classList.remove('is-shake', 'is-checking', 'is-verified');
            slots.forEach(s => s.classList.remove('is-verified', 'is-checking', 'is-error', 'is-shake'));
            paint('');
        }

        // 登录失败时调用：整叠横向抖动 + 每个槽位闪红 + 清空让用户重输
        function shakeDeck(){
            cancelAll();
            deck.classList.remove('is-checking', 'is-verified');
            deck.classList.add('is-shake');
            slots.forEach(s => {
                s.classList.remove('is-verified', 'is-checking');
                s.classList.add('is-error');
                setTimeout(() => s.classList.remove('is-error'), 600);
            });
            setTimeout(() => {
                deck.classList.remove('is-shake');
                paint('');
                try { real.focus({ preventScroll: true }); } catch(_) { real.focus(); }
            }, 480);
        }

        // 核验中：六张牌收拢成一叠 + 蓝色发光脉冲（对应参考视频的 Checking your code）
        function checkingDeck(){
            cancelAll();
            deck.classList.remove('is-verified');
            deck.classList.add('is-checking');
        }

        // 核验通过：绿色印章
        function verifyDeck(){
            cancelAll();
            deck.classList.remove('is-checking');
            deck.classList.add('is-verified');
        }

        // 统一入口：清状态 → 回写数字 → 输满则扇形展开并通知外层自动登录
        function sync(v){
            cancelAll();
            deck.classList.remove('is-checking', 'is-verified');
            if (paint(v)) {
                spread();
                if (typeof window.onOtpComplete === 'function') window.onOtpComplete();
            }
        }

        real.addEventListener('input', () => sync(real.value));
        real.addEventListener('paste', (e) => {
            e.preventDefault();
            const t = ((e.clipboardData || window.clipboardData).getData('text')) || '';
            sync(t);
        });
        real.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && !real.value) { e.preventDefault(); paint(''); }
        });
        slots.forEach(s => s.addEventListener('click', () => { try { real.focus({ preventScroll: true }); } catch(_) { real.focus(); } }));

        // 暴露给登录流程 / 切到验证码 tab 时的回调
        window.otpDeckReset = resetDeck;
        window.otpDeckShake = shakeDeck;
        window.otpDeckChecking = checkingDeck;
        window.otpDeckSuccess = verifyDeck;
        window.otpDeckFocus = function(){
            resetDeck();
            try { real.focus({ preventScroll: true }); } catch(_) { real.focus(); }
        };

        paint('');
    })();
    </script>
