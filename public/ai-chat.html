<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STC AI 助手</title>
    <script src="js/config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
            background: #000;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }

        /* ---------- 整体布局 ---------- */
        .chat-app {
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* ---------- 顶部栏 ---------- */
        .chat-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
        }

        .chat-logo {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #ff4e4e, #ff9f43, #ffe066, #2ed573, #1e90ff, #7c5cff, #ff4e4e);
            padding: 3px;
            flex-shrink: 0;
        }

        .chat-logo::before {
            content: '';
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #000;
        }

        .chat-title {
            flex: 1;
            min-width: 0;
        }

        .chat-title h1 {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
            line-height: 1.3;
        }

        .chat-title p {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
        }

        .model-select {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            border-radius: 999px;
            padding: 7px 14px;
            font-size: 12.5px;
            cursor: pointer;
            outline: none;
            max-width: 180px;
            flex-shrink: 0;
            transition: border-color 0.2s, background 0.2s;
        }

        .model-select:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.25);
        }

        .model-select option {
            background: #1a1a1a;
            color: #fff;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.8);
            border-radius: 999px;
            width: 36px;
            height: 36px;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.14);
            color: #fff;
        }

        /* ---------- 消息区 ---------- */
        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 32px 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            scroll-behavior: smooth;
        }

        .chat-box::-webkit-scrollbar {
            width: 5px;
        }

        .chat-box::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }

        .chat-box::-webkit-scrollbar-track {
            background: transparent;
        }

        /* 欢迎页 */
        .welcome {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 14px;
            padding: 20px;
            animation: fadeIn 0.4s ease;
        }

        .welcome h2 {
            font-size: 30px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .welcome .sub {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.45);
            line-height: 1.7;
        }

        .tips {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 26px;
            max-width: 640px;
        }

        .tips .tip-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 14px 20px;
            font-size: 13.5px;
            color: rgba(255, 255, 255, 0.75);
            cursor: pointer;
            transition: all 0.25s;
            user-select: none;
        }

        .tips .tip-card:hover {
            background: rgba(255, 255, 255, 0.09);
            border-color: rgba(255, 255, 255, 0.3);
            color: #fff;
            transform: translateY(-2px);
        }

        /* 消息气泡 */
        .msg {
            display: flex;
            gap: 14px;
            max-width: 100%;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-user {
            justify-content: flex-end;
        }

        .msg-ai {
            justify-content: flex-start;
        }

        .msg .avatar {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            margin-top: 2px;
        }

        .msg-user .avatar {
            background: #333;
            color: #fff;
            order: 2;
        }

        .msg-ai .avatar {
            background: conic-gradient(from 0deg, #ff4e4e, #ff9f43, #ffe066, #2ed573, #1e90ff, #7c5cff, #ff4e4e);
            padding: 2.5px;
        }

        .msg-ai .avatar::before {
            content: '';
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #000;
        }

        .msg .bubble {
            max-width: 78%;
            padding: 12px 18px;
            border-radius: 16px;
            font-size: 14.5px;
            line-height: 1.75;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .msg-user .bubble {
            background: #fff;
            color: #111;
            border-bottom-right-radius: 4px;
        }

        .msg-ai .bubble {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #f2f2f2;
            border-bottom-left-radius: 4px;
        }

        .msg-system .bubble {
            background: rgba(255, 170, 60, 0.12);
            border: 1px solid rgba(255, 170, 60, 0.25);
            color: #ffd9a8;
        }

        /* AI 气泡里的 markdown 样式 */
        .msg-ai .msg-text code {
            background: rgba(0, 0, 0, 0.4);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: Consolas, 'Courier New', monospace;
            font-size: 13px;
            color: #7fd1ff;
        }

        .msg-ai .msg-text pre.code-block {
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 14px;
            overflow-x: auto;
            margin: 10px 0;
        }

        .msg-ai .msg-text pre.code-block code {
            background: none;
            padding: 0;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre;
            color: #e8e8e8;
        }

        .msg-ai .msg-text strong {
            color: #fff;
        }

        /* 思考中动画 */
        .thinking .bubble {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .thinking .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            animation: blink 1.2s infinite;
        }

        .thinking .dot:nth-child(2) { animation-delay: 0.2s; }
        .thinking .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1); }
        }

        /* ---------- 输入区 ---------- */
        .chat-input-wrap {
            flex-shrink: 0;
            padding: 12px 24px 22px;
        }

        .chat-input-bar {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            max-width: 780px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            padding: 10px 10px 10px 18px;
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
        }

        .chat-input-bar:focus-within {
            border-color: rgba(255, 255, 255, 0.35);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.06);
        }

        .chat-input-bar textarea {
            flex: 1;
            resize: none;
            background: transparent;
            border: none;
            color: #fff;
            font-family: inherit;
            font-size: 14.5px;
            line-height: 1.6;
            padding: 6px 0;
            outline: none;
            max-height: 140px;
            min-height: 28px;
        }

        .chat-input-bar textarea::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        .send-btn {
            background: linear-gradient(135deg, #4d8dff, #7c5cff);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(76, 141, 255, 0.35);
        }

        .send-btn:hover:not(:disabled) {
            transform: scale(1.06);
            box-shadow: 0 6px 18px rgba(76, 141, 255, 0.5);
        }

        .send-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            box-shadow: none;
        }

        .input-hint {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.28);
            text-align: center;
            margin-top: 10px;
        }

        /* ---------- 未登录遮罩 ---------- */
        .login-mask {
            position: fixed;
            inset: 0;
            z-index: 30;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-mask.show {
            display: flex;
        }

        .login-mask-box {
            text-align: center;
            max-width: 360px;
            padding: 44px 38px;
            background: #141414;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.3s ease;
        }

        .login-mask-box .logo-big {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #ff4e4e, #ff9f43, #ffe066, #2ed573, #1e90ff, #7c5cff, #ff4e4e);
            padding: 4px;
            margin: 0 auto 16px;
        }

        .login-mask-box .logo-big::before {
            content: '';
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #141414;
        }

        .login-mask-box h2 {
            font-size: 20px;
            color: #fff;
            margin-bottom: 8px;
        }

        .login-mask-box p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.7;
            margin-bottom: 26px;
        }

        .login-mask-box .btn-login,
        .login-mask-box .btn-home {
            display: inline-block;
            padding: 11px 34px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            margin: 0 6px;
        }

        .login-mask-box .btn-login {
            background: linear-gradient(135deg, #4d8dff, #7c5cff);
            color: #fff;
            box-shadow: 0 6px 16px rgba(76, 141, 255, 0.35);
        }

        .login-mask-box .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 22px rgba(76, 141, 255, 0.5);
        }

        .login-mask-box .btn-home {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #fff;
        }

        .login-mask-box .btn-home:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        @media (max-width: 600px) {
            .chat-header { padding: 12px 16px; }
            .chat-box { padding: 20px 14px; }
            .welcome h2 { font-size: 24px; }
            .model-select { max-width: 130px; font-size: 11.5px; }
            .chat-title p { display: none; }
            .msg .bubble { max-width: 86%; }
            .tips .tip-card { padding: 11px 16px; font-size: 12.5px; }
            .chat-input-wrap { padding: 10px 12px 16px; }
        }
    </style>
</head>
<body>

    <div class="chat-app">
        <!-- 顶部栏 -->
        <header class="chat-header">
            <div class="chat-logo"></div>
            <div class="chat-title">
                <h1>STC AI 助手</h1>
                <p>SenseNova 大模型驱动</p>
            </div>
            <select id="model-select" class="model-select" title="选择模型"></select>
            <button class="icon-btn" id="clear-btn" title="清空对话">🗑️</button>
        </header>

        <!-- 消息区 -->
        <main class="chat-box" id="chat-box">
            <div class="welcome" id="welcome">
                <h2>Hi，今天从哪里开始</h2>
                <p class="sub">由商汤日日新（SenseNova）大模型驱动<br>可以聊天、写作、编程、解答问题</p>
                <div class="tips">
                    <span class="tip-card">✍️ 写一段工作周报</span>
                    <span class="tip-card">💡 帮我解释什么是线程池</span>
                    <span class="tip-card">🐍 用 Python 写个贪吃蛇</span>
                    <span class="tip-card">😄 讲个冷笑话</span>
                </div>
            </div>
        </main>

        <!-- 输入区 -->
        <div class="chat-input-wrap">
            <div class="chat-input-bar">
                <textarea id="input" placeholder="输入你的问题，Enter 发送，Shift+Enter 换行"></textarea>
                <button class="send-btn" id="send-btn" title="发送">➤</button>
            </div>
            <div class="input-hint">内容由 AI 生成，仅供参考 · 支持流式输出</div>
        </div>

        <!-- 未登录遮罩 -->
        <div class="login-mask" id="login-mask">
            <div class="login-mask-box">
                <div class="logo-big"></div>
                <h2>请先登录</h2>
                <p>AI 助手仅对已登录的 STC 成员开放</p>
                <a class="btn-login" href="/login">去登录</a>
                <a class="btn-home" href="/">返回首页</a>
            </div>
        </div>
    </div>

    <script>
        // ==================== 模型配置 ====================
        const MODELS = {
            'sensenova-6.7-flash-lite': 'SenseNova 6.7（推荐）',
            'sensenova-6.8-flash-lite': 'SenseNova 6.8',
            'glm-5.2': 'GLM-5.2',
            'deepseek-v4-flash': 'DeepSeek V4'
        };
        const SYSTEM_PROMPT = '你是STC工会任务平台的AI助手，由商汤日日新（SenseNova）大模型提供技术支持。请用简洁、友好的中文回答问题，涉及代码时给出完整可运行的示例。';

        // ==================== 状态 ====================
        let messages = [];      // {role, content}
        let sending = false;
        let _csrfCache = null;

        const chatBox = document.getElementById('chat-box');
        const inputEl = document.getElementById('input');
        const sendBtn = document.getElementById('send-btn');
        const modelSelect = document.getElementById('model-select');
        const welcomeEl = document.getElementById('welcome');

        // 恢复历史
        try {
            const saved = JSON.parse(localStorage.getItem('stc_ai_history') || '[]');
            if (Array.isArray(saved)) {
                messages = saved.filter(m => (m.role === 'user' || m.role === 'assistant') && typeof m.content === 'string');
            }
        } catch (e) {}

        // 填充模型下拉
        for (const [value, label] of Object.entries(MODELS)) {
            const opt = document.createElement('option');
            opt.value = value;
            opt.textContent = label;
            modelSelect.appendChild(opt);
        }
        modelSelect.value = localStorage.getItem('stc_ai_model') || 'sensenova-6.7-flash-lite';

        // ==================== 工具函数 ====================
        function saveHistory() {
            try {
                localStorage.setItem('stc_ai_history', JSON.stringify(messages.slice(-60)));
            } catch (e) {}
        }

        function escapeHtml(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // 轻量 markdown：代码块 / 行内代码 / 粗体 / 换行
        function renderMarkdown(text) {
            const escaped = escapeHtml(text);
            const parts = escaped.split(/```/);
            let html = '';
            for (let i = 0; i < parts.length; i++) {
                if (i % 2 === 1) {
                    const code = parts[i].replace(/^[a-zA-Z]+\n/, '').replace(/\n$/, '');
                    html += '<pre class="code-block"><code>' + code + '</code></pre>';
                } else {
                    html += parts[i]
                        .replace(/`([^`]+)`/g, '<code>$1</code>')
                        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                        .replace(/\n/g, '<br>');
                }
            }
            return html;
        }

        function scrollBottom() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // ==================== 消息渲染 ====================
        function buildBubble(role, content, isHtml) {
            const wrap = document.createElement('div');
            wrap.className = 'msg msg-' + role;

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = role === 'user' ? '我' : '';

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            const text = document.createElement('div');
            text.className = 'msg-text';
            if (isHtml) {
                text.innerHTML = content;
            } else if (role === 'assistant') {
                text.innerHTML = renderMarkdown(content);
            } else {
                text.textContent = content;
            }
            bubble.appendChild(text);
            wrap.appendChild(avatar);
            wrap.appendChild(bubble);
            return wrap;
        }

        function appendBubble(role, content) {
            welcomeEl.style.display = 'none';
            const el = buildBubble(role, content);
            chatBox.appendChild(el);
            scrollBottom();
            return el;
        }

        function showThinking() {
            const wrap = document.createElement('div');
            wrap.className = 'msg msg-ai thinking';
            wrap.id = 'thinking-msg';
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            for (let i = 0; i < 3; i++) {
                const dot = document.createElement('span');
                dot.className = 'dot';
                bubble.appendChild(dot);
            }
            wrap.appendChild(avatar);
            wrap.appendChild(bubble);
            chatBox.appendChild(wrap);
            scrollBottom();
        }

        function removeThinking() {
            const t = document.getElementById('thinking-msg');
            if (t) t.remove();
        }

        function renderAll() {
            chatBox.querySelectorAll('.msg').forEach(el => el.remove());
            welcomeEl.style.display = messages.length ? 'none' : '';
            for (const m of messages) {
                chatBox.appendChild(buildBubble(m.role, m.content));
            }
            scrollBottom();
        }

        // ==================== CSRF / Nonce ====================
        async function getCSRFToken() {
            // 已缓存的 token 直接复用，避免每次提问都多一次网络往返
            if (_csrfCache) return _csrfCache;
            try {
                const resp = await fetch('/api/csrf-token', { credentials: 'include' });
                if (resp.ok) {
                    const data = await resp.json();
                    _csrfCache = data.csrfToken;
                    return data.csrfToken;
                }
            } catch (e) {
                console.error('获取CSRF token失败:', e);
            }
            return null;
        }

        // 一次性 nonce（防重放）
        function genNonce() {
            return Date.now().toString(36) + Math.random().toString(16).slice(2, 10);
        }

        // ==================== 发送消息（流式） ====================
        async function send() {
            const text = inputEl.value.trim();
            if (!text || sending) return;

            inputEl.value = '';
            autoResize();

            messages.push({ role: 'user', content: text });
            saveHistory();
            appendBubble('user', text);
            showThinking();

            sending = true;
            sendBtn.disabled = true;

            try {
                let resp = null;
                let retried = false;
                for (;;) {
                    const token = await getCSRFToken();
                    resp = await fetch('/api/ai/chat', {
                        method: 'POST',
                        credentials: 'include',
                        headers: {
                            'Content-Type': 'application/json',
                            ...(token ? { 'X-CSRF-Token': token } : {}),
                            'X-Request-Nonce': genNonce()
                        },
                        body: JSON.stringify({
                            messages: [{ role: 'system', content: SYSTEM_PROMPT }, ...messages],
                            model: modelSelect.value
                        })
                    });

                    // CSRF token 过期时清缓存重试一次
                    if (resp.status === 403 && !retried) {
                        _csrfCache = null;
                        retried = true;
                        continue;
                    }
                    break;
                }

                if (!resp.ok) {
                    const err = await resp.json().catch(() => ({}));
                    if (resp.status === 403 && (err.error === '请先登录' || err.message === '请先登录')) {
                        showLoginMask();
                    }
                    throw new Error(err.message || err.error || ('请求失败 (' + resp.status + ')，请稍后重试'));
                }

                // 把"思考中"气泡升级为正式 AI 气泡
                removeThinking();
                const aiEl = appendBubble('assistant', '');
                const aiTextEl = aiEl.querySelector('.msg-text');

                const reader = resp.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let full = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });

                    const parts = buffer.split('\n\n');
                    buffer = parts.pop();
                    for (const part of parts) {
                        const line = part.split('\n').find(l => l.startsWith('data:'));
                        if (!line) continue;
                        const data = line.slice(5).trim();
                        if (!data || data === '[DONE]') continue;
                        try {
                            const json = JSON.parse(data);
                            const delta = json.choices && json.choices[0] && json.choices[0].delta
                                ? json.choices[0].delta.content : '';
                            if (delta) {
                                full += delta;
                                aiTextEl.textContent = full;
                            }
                        } catch (e) { /* 忽略解析失败 */ }
                    }
                    scrollBottom();
                }

                // 流结束，渲染完整 markdown
                aiTextEl.innerHTML = full ? renderMarkdown(full) : '（未收到回复，请重试）';
                messages.push({ role: 'assistant', content: full });
                saveHistory();
            } catch (e) {
                removeThinking();
                appendBubble('system', '❌ ' + e.message);
            } finally {
                sending = false;
                sendBtn.disabled = false;
                inputEl.focus();
                scrollBottom();
            }
        }

        // ==================== 输入框自适应 ====================
        function autoResize() {
            inputEl.style.height = 'auto';
            inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
        }

        // ==================== 清空对话 ====================
        function clearChat() {
            if (sending) return;
            messages = [];
            saveHistory();
            renderAll();
            inputEl.focus();
        }

        // ==================== 事件绑定 ====================
        sendBtn.addEventListener('click', send);

        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                send();
            }
        });

        inputEl.addEventListener('input', autoResize);

        document.getElementById('clear-btn').addEventListener('click', clearChat);

        modelSelect.addEventListener('change', () => {
            localStorage.setItem('stc_ai_model', modelSelect.value);
        });

        // 欢迎页快捷提问
        welcomeEl.querySelectorAll('.tips span').forEach(span => {
            span.addEventListener('click', () => {
                inputEl.value = span.textContent.replace(/^[^\u4e00-\u9fa5a-zA-Z0-9]+/, '');
                autoResize();
                inputEl.focus();
            });
        });

        // ==================== 登录校验 ====================
        const loginMask = document.getElementById('login-mask');

        function showLoginMask() {
            loginMask.classList.add('show');
            inputEl.disabled = true;
            sendBtn.disabled = true;
        }

        async function checkLogin() {
            try {
                const resp = await fetch('/api/user', { credentials: 'include' });
                if (resp.ok) return true;
            } catch (e) {}
            return false;
        }

        // ==================== 初始化 ====================
        (async function init() {
            const loggedIn = await checkLogin();
            if (!loggedIn) {
                showLoginMask();
                return;
            }
            getCSRFToken(); // 预取 CSRF token，首次提问更快
            renderAll();
            inputEl.focus();
        })();
    </script>
</body>
</html>
