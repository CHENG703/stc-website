<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STC - AI 助手</title>
    <script src="js/config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: -30%;
            left: -30%;
            width: 160%;
            height: 160%;
            background: radial-gradient(circle at 30% 30%, rgba(102, 126, 234, 0.22) 0%, transparent 50%),
                        radial-gradient(circle at 70% 70%, rgba(118, 75, 162, 0.22) 0%, transparent 50%);
            z-index: -1;
        }

        .chat-app {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 860px;
            height: calc(100vh - 32px);
            min-height: 520px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ---------- 头部 ---------- */
        .chat-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
        }

        .chat-logo {
            width: 44px;
            height: 44px;
            flex-shrink: 0;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.4);
        }

        .chat-title {
            flex: 1;
            min-width: 0;
        }

        .chat-title h1 {
            font-size: 17px;
            font-weight: 700;
            color: #fff;
            line-height: 1.3;
        }

        .chat-title p {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.55);
        }

        .model-select {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 10px;
            padding: 8px 10px;
            font-size: 13px;
            cursor: pointer;
            outline: none;
            max-width: 220px;
        }

        .model-select option {
            background: #16213e;
            color: #fff;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            border-radius: 10px;
            width: 38px;
            height: 38px;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .icon-btn:hover {
            background: rgba(255, 82, 82, 0.3);
            border-color: rgba(255, 82, 82, 0.5);
        }

        /* ---------- 消息区 ---------- */
        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .chat-box::-webkit-scrollbar {
            width: 6px;
        }

        .chat-box::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
        }

        .welcome {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            padding: 40px 20px;
        }

        .welcome .w-icon {
            font-size: 46px;
            margin-bottom: 12px;
            display: block;
        }

        .welcome h2 {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 8px;
        }

        .welcome p {
            font-size: 13px;
            line-height: 1.8;
        }

        .welcome .tips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-top: 18px;
        }

        .welcome .tips span {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .welcome .tips span:hover {
            background: rgba(102, 126, 234, 0.3);
            border-color: rgba(102, 126, 234, 0.6);
            color: #fff;
        }

        /* 消息气泡 */
        .msg {
            display: flex;
            gap: 10px;
            max-width: 100%;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-user {
            justify-content: flex-end;
        }

        .msg-ai {
            justify-content: flex-start;
        }

        .msg .avatar {
            width: 34px;
            height: 34px;
            flex-shrink: 0;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            margin-top: 2px;
        }

        .msg-user .avatar {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            order: 2;
        }

        .msg-ai .avatar {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 17px;
        }

        .msg .bubble {
            max-width: 78%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.7;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .msg-user .bubble {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border-bottom-right-radius: 4px;
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.25);
        }

        .msg-ai .bubble {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #eaeaf5;
            border-bottom-left-radius: 4px;
        }

        .msg-system .bubble {
            background: rgba(255, 170, 60, 0.15);
            border: 1px solid rgba(255, 170, 60, 0.3);
            color: #ffd9a8;
        }

        /* AI 气泡里的 markdown 样式 */
        .msg-ai .msg-text code {
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: Consolas, 'Courier New', monospace;
            font-size: 12.5px;
        }

        .msg-ai .msg-text pre.code-block {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px;
            overflow-x: auto;
            margin: 8px 0;
        }

        .msg-ai .msg-text pre.code-block code {
            background: none;
            padding: 0;
            font-size: 12.5px;
            line-height: 1.6;
            white-space: pre;
        }

        .msg-ai .msg-text strong {
            color: #fff;
        }

        /* 思考中动画 */
        .thinking .bubble {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .thinking .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            animation: blink 1.2s infinite;
        }

        .thinking .dot:nth-child(2) { animation-delay: 0.2s; }
        .thinking .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1); }
        }

        /* ---------- 输入区 ---------- */
        .chat-input-bar {
            display: flex;
            align-items: flex-end;
            gap: 10px;
            padding: 14px 20px 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.04);
        }

        .chat-input-bar textarea {
            flex: 1;
            resize: none;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            color: #fff;
            font-family: inherit;
            font-size: 14px;
            line-height: 1.6;
            padding: 12px 14px;
            outline: none;
            max-height: 140px;
            min-height: 48px;
            transition: border-color 0.2s;
        }

        .chat-input-bar textarea::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .chat-input-bar textarea:focus {
            border-color: rgba(102, 126, 234, 0.7);
        }

        .send-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            border-radius: 14px;
            height: 48px;
            padding: 0 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.3);
        }

        .send-btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.45);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .input-hint {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.35);
            padding: 0 4px;
            margin-top: -6px;
            padding-bottom: 14px;
            text-align: center;
        }

        /* ---------- 未登录遮罩 ---------- */
        .login-mask {
            position: absolute;
            inset: 0;
            z-index: 30;
            background: rgba(13, 17, 30, 0.78);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-mask.show {
            display: flex;
        }

        .login-mask-box {
            text-align: center;
            max-width: 360px;
            padding: 40px 36px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.3s ease;
        }

        .login-mask-box .w-icon {
            font-size: 44px;
            display: block;
            margin-bottom: 14px;
        }

        .login-mask-box h2 {
            font-size: 20px;
            color: #fff;
            margin-bottom: 8px;
        }

        .login-mask-box p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.7;
            margin-bottom: 24px;
        }

        .login-mask-box .btn-login,
        .login-mask-box .btn-home {
            display: inline-block;
            padding: 11px 34px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            margin: 0 6px;
        }

        .login-mask-box .btn-login {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.35);
        }

        .login-mask-box .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.5);
        }

        .login-mask-box .btn-home {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .login-mask-box .btn-home:hover {
            background: rgba(255, 255, 255, 0.18);
        }

        @media (max-width: 600px) {
            body { padding: 0; }
            .chat-app { height: 100vh; border-radius: 0; border: none; }
            .model-select { max-width: 150px; font-size: 12px; }
            .chat-title p { display: none; }
            .msg .bubble { max-width: 85%; }
        }
    </style>
</head>
<body>

    <div class="chat-app">
        <!-- 头部 -->
        <header class="chat-header">
            <div class="chat-logo">🤖</div>
            <div class="chat-title">
                <h1>AI 助手</h1>
                <p>Powered by SenseNova · 日日新</p>
            </div>
            <select id="model-select" class="model-select" title="选择模型"></select>
            <button class="icon-btn" id="clear-btn" title="清空对话">🗑️</button>
        </header>

        <!-- 消息区 -->
        <main class="chat-box" id="chat-box">
            <div class="welcome" id="welcome">
                <span class="w-icon">🤖</span>
                <h2>你好，我是 STC AI 助手</h2>
                <p>由商汤日日新（SenseNova）大模型驱动<br>可以聊天、写作、编程、解答问题</p>
                <div class="tips">
                    <span>写一段工作周报</span>
                    <span>帮我解释一下什么是线程池</span>
                    <span>用 Python 写个贪吃蛇</span>
                    <span>讲个冷笑话</span>
                </div>
            </div>
        </main>

        <!-- 输入区 -->
        <footer>
            <div class="chat-input-bar">
                <textarea id="input" placeholder="输入你的问题，Enter 发送，Shift+Enter 换行"></textarea>
                <button class="send-btn" id="send-btn">发送</button>
            </div>
            <div class="input-hint">内容由 AI 生成，仅供参考 · 支持流式输出</div>
        </footer>

        <!-- 未登录遮罩 -->
        <div class="login-mask" id="login-mask">
            <div class="login-mask-box">
                <span class="w-icon">🔒</span>
                <h2>请先登录</h2>
                <p>AI 助手仅对已登录的 STC 成员开放</p>
                <a class="btn-login" href="/login">去登录</a>
                <a class="btn-home" href="/">返回首页</a>
            </div>
        </div>
    </div>

    <script>
        // ==================== 模型配置 ====================
        const MODELS = {
            'sensenova-6.7-flash-lite': 'SenseNova 6.7（推荐）',
            'sensenova-6.8-flash-lite': 'SenseNova 6.8',
            'glm-5.2': 'GLM-5.2',
            'deepseek-v4-flash': 'DeepSeek V4'
        };
        const SYSTEM_PROMPT = '你是STC工会任务平台的AI助手，由商汤日日新（SenseNova）大模型提供技术支持。请用简洁、友好的中文回答问题，涉及代码时给出完整可运行的示例。';

        // ==================== 状态 ====================
        let messages = [];      // {role, content}
        let sending = false;
        let _csrfCache = null;

        const chatBox = document.getElementById('chat-box');
        const inputEl = document.getElementById('input');
        const sendBtn = document.getElementById('send-btn');
        const modelSelect = document.getElementById('model-select');
        const welcomeEl = document.getElementById('welcome');

        // 恢复历史
        try {
            const saved = JSON.parse(localStorage.getItem('stc_ai_history') || '[]');
            if (Array.isArray(saved)) {
                messages = saved.filter(m => (m.role === 'user' || m.role === 'assistant') && typeof m.content === 'string');
            }
        } catch (e) {}

        // 填充模型下拉
        for (const [value, label] of Object.entries(MODELS)) {
            const opt = document.createElement('option');
            opt.value = value;
            opt.textContent = label;
            modelSelect.appendChild(opt);
        }
        modelSelect.value = localStorage.getItem('stc_ai_model') || 'sensenova-6.7-flash-lite';

        // ==================== 工具函数 ====================
        function saveHistory() {
            try {
                localStorage.setItem('stc_ai_history', JSON.stringify(messages.slice(-60)));
            } catch (e) {}
        }

        function escapeHtml(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // 轻量 markdown：代码块 / 行内代码 / 粗体 / 换行
        function renderMarkdown(text) {
            const escaped = escapeHtml(text);
            const parts = escaped.split(/```/);
            let html = '';
            for (let i = 0; i < parts.length; i++) {
                if (i % 2 === 1) {
                    const code = parts[i].replace(/^[a-zA-Z]+\n/, '').replace(/\n$/, '');
                    html += '<pre class="code-block"><code>' + code + '</code></pre>';
                } else {
                    html += parts[i]
                        .replace(/`([^`]+)`/g, '<code>$1</code>')
                        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                        .replace(/\n/g, '<br>');
                }
            }
            return html;
        }

        function scrollBottom() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // ==================== 消息渲染 ====================
        function buildBubble(role, content, isHtml) {
            const wrap = document.createElement('div');
            wrap.className = 'msg msg-' + role;

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = role === 'user' ? '你' : '🤖';

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            const text = document.createElement('div');
            text.className = 'msg-text';
            if (isHtml) {
                text.innerHTML = content;
            } else if (role === 'assistant') {
                text.innerHTML = renderMarkdown(content);
            } else {
                text.textContent = content;
            }
            bubble.appendChild(text);
            wrap.appendChild(avatar);
            wrap.appendChild(bubble);
            return wrap;
        }

        function appendBubble(role, content) {
            welcomeEl.style.display = 'none';
            const el = buildBubble(role, content);
            chatBox.appendChild(el);
            scrollBottom();
            return el;
        }

        function showThinking() {
            const wrap = document.createElement('div');
            wrap.className = 'msg msg-ai thinking';
            wrap.id = 'thinking-msg';
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = '🤖';
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            for (let i = 0; i < 3; i++) {
                const dot = document.createElement('span');
                dot.className = 'dot';
                bubble.appendChild(dot);
            }
            wrap.appendChild(avatar);
            wrap.appendChild(bubble);
            chatBox.appendChild(wrap);
            scrollBottom();
        }

        function removeThinking() {
            const t = document.getElementById('thinking-msg');
            if (t) t.remove();
        }

        function renderAll() {
            chatBox.querySelectorAll('.msg').forEach(el => el.remove());
            welcomeEl.style.display = messages.length ? 'none' : '';
            for (const m of messages) {
                chatBox.appendChild(buildBubble(m.role, m.content));
            }
            scrollBottom();
        }

        // ==================== CSRF / Nonce ====================
        async function getCSRFToken() {
            try {
                const resp = await fetch('/api/csrf-token', { credentials: 'include' });
                if (resp.ok) {
                    const data = await resp.json();
                    _csrfCache = data.csrfToken;
                    return data.csrfToken;
                }
            } catch (e) {
                console.error('获取CSRF token失败:', e);
            }
            return null;
        }

        // 一次性 nonce（防重放）
        function genNonce() {
            return Date.now().toString(36) + Math.random().toString(16).slice(2, 10);
        }

        // ==================== 发送消息（流式） ====================
        async function send() {
            const text = inputEl.value.trim();
            if (!text || sending) return;

            inputEl.value = '';
            autoResize();

            messages.push({ role: 'user', content: text });
            saveHistory();
            appendBubble('user', text);
            showThinking();

            sending = true;
            sendBtn.disabled = true;

            let resp = null;
            let retried = false;
            for (;;) {
                const token = await getCSRFToken();
                resp = await fetch('/api/ai/chat', {
                    method: 'POST',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json',
                        ...(token ? { 'X-CSRF-Token': token } : {}),
                        'X-Request-Nonce': genNonce()
                    },
                    body: JSON.stringify({
                        messages: [{ role: 'system', content: SYSTEM_PROMPT }, ...messages],
                        model: modelSelect.value
                    })
                });

                // CSRF token 过期时清缓存重试一次
                if (resp.status === 403 && !retried) {
                    _csrfCache = null;
                    retried = true;
                    continue;
                }
                break;
            }

            if (!resp.ok) {
                const err = await resp.json().catch(() => ({}));
                if (resp.status === 403 && (err.error === '请先登录' || err.message === '请先登录')) {
                    showLoginMask();
                }
                throw new Error(err.message || err.error || ('请求失败 (' + resp.status + ')，请稍后重试'));
            }

                // 把"思考中"气泡升级为正式 AI 气泡
                removeThinking();
                const aiEl = appendBubble('assistant', '');
                const aiTextEl = aiEl.querySelector('.msg-text');

                const reader = resp.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let full = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });

                    const parts = buffer.split('\n\n');
                    buffer = parts.pop();
                    for (const part of parts) {
                        const line = part.split('\n').find(l => l.startsWith('data:'));
                        if (!line) continue;
                        const data = line.slice(5).trim();
                        if (!data || data === '[DONE]') continue;
                        try {
                            const json = JSON.parse(data);
                            const delta = json.choices && json.choices[0] && json.choices[0].delta
                                ? json.choices[0].delta.content : '';
                            if (delta) {
                                full += delta;
                                aiTextEl.textContent = full;
                            }
                        } catch (e) { /* 忽略解析失败 */ }
                    }
                    scrollBottom();
                }

                // 流结束，渲染完整 markdown
                aiTextEl.innerHTML = full ? renderMarkdown(full) : '（未收到回复，请重试）';
                messages.push({ role: 'assistant', content: full });
                saveHistory();

            } catch (e) {
                removeThinking();
                appendBubble('system', '❌ ' + e.message);
            } finally {
                sending = false;
                sendBtn.disabled = false;
                inputEl.focus();
                scrollBottom();
            }
        }

        // ==================== 输入框自适应 ====================
        function autoResize() {
            inputEl.style.height = 'auto';
            inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
        }

        // ==================== 清空对话 ====================
        function clearChat() {
            if (sending) return;
            messages = [];
            saveHistory();
            renderAll();
            inputEl.focus();
        }

        // ==================== 事件绑定 ====================
        sendBtn.addEventListener('click', send);

        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                send();
            }
        });

        inputEl.addEventListener('input', autoResize);

        document.getElementById('clear-btn').addEventListener('click', clearChat);

        modelSelect.addEventListener('change', () => {
            localStorage.setItem('stc_ai_model', modelSelect.value);
        });

        // 欢迎页快捷提问
        welcomeEl.querySelectorAll('.tips span').forEach(span => {
            span.addEventListener('click', () => {
                inputEl.value = span.textContent;
                autoResize();
                inputEl.focus();
            });
        });

        // ==================== 登录校验 ====================
        const loginMask = document.getElementById('login-mask');

        function showLoginMask() {
            loginMask.classList.add('show');
            inputEl.disabled = true;
            sendBtn.disabled = true;
        }

        async function checkLogin() {
            try {
                const resp = await fetch('/api/user', { credentials: 'include' });
                if (resp.ok) return true;
            } catch (e) {}
            return false;
        }

        // ==================== 初始化 ====================
        (async function init() {
            const loggedIn = await checkLogin();
            if (!loggedIn) {
                showLoginMask();
                return;
            }
            renderAll();
            inputEl.focus();
        })();
    </script>
</body>
</html>
