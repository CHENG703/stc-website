<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STC AI 助手</title>
    <script src="js/config.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', sans-serif;
            background: #000;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }

        /* ---------- 整体布局 ---------- */
        .app {
            display: flex;
            height: 100vh;
            width: 100%;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        /* ---------- 侧边栏 ---------- */
        .sidebar {
            width: 264px;
            flex-shrink: 0;
            background: #111;
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            transition: transform 0.25s ease;
            z-index: 40;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
        }

        .sidebar-brand {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sidebar-brand .logo-mini {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #ff4e4e, #ff9f43, #ffe066, #2ed573, #1e90ff, #7c5cff, #ff4e4e);
            padding: 2px;
            flex-shrink: 0;
        }

        .sidebar-brand .logo-mini::before {
            content: '';
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #111;
        }

        .new-chat-btn {
            width: 100%;
            padding: 10px 0;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 10px;
            color: #fff;
            font-size: 13.5px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .new-chat-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.28);
        }

        .conv-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 8px;
        }

        .conv-list::-webkit-scrollbar {
            width: 4px;
        }

        .conv-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
        }

        .conv-empty {
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 12.5px;
            padding: 30px 10px;
            line-height: 1.8;
        }

        .conv-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 2px;
            transition: background 0.15s;
            position: relative;
        }

        .conv-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .conv-item.active {
            background: rgba(255, 255, 255, 0.1);
        }

        .conv-item .conv-body {
            flex: 1;
            min-width: 0;
        }

        .conv-item .conv-title {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.9);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conv-item .conv-meta {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.35);
            margin-top: 2px;
        }

        .conv-item .conv-del {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.35);
            font-size: 13px;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 6px;
            opacity: 0;
            transition: all 0.15s;
            flex-shrink: 0;
        }

        .conv-item:hover .conv-del {
            opacity: 1;
        }

        .conv-item .conv-del:hover {
            color: #ff6b6b;
            background: rgba(255, 255, 255, 0.08);
        }

        .sidebar-mask {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            z-index: 35;
        }

        /* ---------- 顶部栏 ---------- */
        .chat-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
        }

        .menu-btn {
            display: none;
        }

        .chat-logo {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #ff4e4e, #ff9f43, #ffe066, #2ed573, #1e90ff, #7c5cff, #ff4e4e);
            padding: 3px;
            flex-shrink: 0;
        }

        .chat-logo::before {
            content: '';
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #000;
        }

        .chat-title {
            flex: 1;
            min-width: 0;
        }

        .chat-title h1 {
            font-size: 15.5px;
            font-weight: 600;
            color: #fff;
            line-height: 1.3;
        }

        .chat-title p {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
        }

        /* 深度/快速思考切换 */
        .mode-switch {
            display: flex;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 999px;
            padding: 3px;
            flex-shrink: 0;
        }

        .mode-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.55);
            font-size: 12.5px;
            padding: 6px 14px;
            border-radius: 999px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #4d8dff, #7c5cff);
            color: #fff;
            box-shadow: 0 2px 10px rgba(76, 141, 255, 0.35);
        }

        .model-select {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #fff;
            border-radius: 999px;
            padding: 7px 14px;
            font-size: 12.5px;
            cursor: pointer;
            outline: none;
            max-width: 170px;
            flex-shrink: 0;
            transition: border-color 0.2s, background 0.2s;
        }

        .model-select:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.25);
        }

        .model-select option {
            background: #1a1a1a;
            color: #fff;
        }

        /* ---------- 消息区 ---------- */
        .chat-box {
            flex: 1;
            overflow-y: auto;
            padding: 28px 20px;
            display: flex;
            flex-direction: column;
            gap: 22px;
            scroll-behavior: smooth;
        }

        .chat-box-inner {
            width: 100%;
            max-width: 780px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .chat-box::-webkit-scrollbar {
            width: 5px;
        }

        .chat-box::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }

        .chat-box::-webkit-scrollbar-track {
            background: transparent;
        }

        /* 欢迎页 */
        .welcome {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 14px;
            padding: 20px;
            animation: fadeIn 0.4s ease;
        }

        .welcome h2 {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .welcome .sub {
            font-size: 13.5px;
            color: rgba(255, 255, 255, 0.45);
            line-height: 1.7;
        }

        .tips {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 22px;
            max-width: 620px;
        }

        .tips .tip-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            padding: 12px 18px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.75);
            cursor: pointer;
            transition: all 0.25s;
            user-select: none;
        }

        .tips .tip-card:hover {
            background: rgba(255, 255, 255, 0.09);
            border-color: rgba(255, 255, 255, 0.3);
            color: #fff;
            transform: translateY(-2px);
        }

        /* 消息气泡 */
        .msg {
            display: flex;
            gap: 12px;
            max-width: 100%;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .msg-user {
            justify-content: flex-end;
        }

        .msg-ai {
            justify-content: flex-start;
        }

        .msg .avatar {
            width: 32px;
            height: 32px;
            flex-shrink: 0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            margin-top: 2px;
        }

        .msg-user .avatar {
            background: #333;
            color: #fff;
            order: 2;
        }

        .msg-ai .avatar {
            background: conic-gradient(from 0deg, #ff4e4e, #ff9f43, #ffe066, #2ed573, #1e90ff, #7c5cff, #ff4e4e);
            padding: 2.5px;
        }

        .msg-ai .avatar::before {
            content: '';
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #000;
        }

        .msg .bubble {
            max-width: 78%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 14.5px;
            line-height: 1.75;
            word-break: break-word;
            white-space: pre-wrap;
            min-width: 0;
        }

        .msg-user .bubble {
            background: #fff;
            color: #111;
            border-bottom-right-radius: 4px;
        }

        .msg-ai .bubble {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.06);
            color: #f2f2f2;
            border-bottom-left-radius: 4px;
        }

        .msg-system .bubble {
            background: rgba(255, 170, 60, 0.12);
            border: 1px solid rgba(255, 170, 60, 0.25);
            color: #ffd9a8;
        }

        /* 用户消息里的图片 */
        .msg-images {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
        }

        .msg-images img {
            max-width: 180px;
            max-height: 140px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            object-fit: cover;
            display: block;
        }

        /* AI 气泡里的 markdown 样式 */
        .msg-ai .msg-text code {
            background: rgba(0, 0, 0, 0.4);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: Consolas, 'Courier New', monospace;
            font-size: 13px;
            color: #7fd1ff;
        }

        .msg-ai .msg-text pre.code-block {
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 14px;
            overflow-x: auto;
            margin: 10px 0;
        }

        .msg-ai .msg-text pre.code-block code {
            background: none;
            padding: 0;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre;
            color: #e8e8e8;
        }

        .msg-ai .msg-text strong {
            color: #fff;
        }

        /* 深度思考过程 */
        .think-box {
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            margin-bottom: 10px;
            overflow: hidden;
        }

        .think-box .think-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 8px 12px;
            font-size: 12.5px;
            color: rgba(255, 255, 255, 0.75);
            cursor: pointer;
            user-select: none;
        }

        .think-box .think-header:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .think-box .think-toggle {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            transition: transform 0.2s;
        }

        .think-box .think-content {
            display: none;
            padding: 4px 12px 12px;
            font-size: 13px;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.6);
            max-height: 320px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .think-box.open .think-content {
            display: block;
        }

        .think-box.open .think-toggle {
            transform: rotate(180deg);
        }

        .think-box.live .think-content {
            display: block;
        }

        /* 思考中动画 */
        .thinking .bubble {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .thinking .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            animation: blink 1.2s infinite;
        }

        .thinking .dot:nth-child(2) { animation-delay: 0.2s; }
        .thinking .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
            40% { opacity: 1; transform: scale(1); }
        }

        /* ---------- 输入区 ---------- */
        .chat-input-wrap {
            flex-shrink: 0;
            padding: 12px 20px 20px;
        }

        .chat-input-inner {
            max-width: 780px;
            margin: 0 auto;
        }

        .chat-input-bar {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 22px;
            padding: 8px 8px 8px 10px;
            transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
        }

        .chat-input-bar:focus-within {
            border-color: rgba(255, 255, 255, 0.35);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.06);
        }

        .chat-input-bar textarea {
            flex: 1;
            resize: none;
            background: transparent;
            border: none;
            color: #fff;
            font-family: inherit;
            font-size: 14.5px;
            line-height: 1.6;
            padding: 6px 0;
            outline: none;
            max-height: 140px;
            min-height: 28px;
        }

        .chat-input-bar textarea::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        .img-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.55);
            font-size: 18px;
            cursor: pointer;
            width: 34px;
            height: 34px;
            border-radius: 10px;
            flex-shrink: 0;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .img-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .send-btn {
            background: linear-gradient(135deg, #4d8dff, #7c5cff);
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(76, 141, 255, 0.35);
        }

        .send-btn:hover:not(:disabled) {
            transform: scale(1.06);
            box-shadow: 0 6px 18px rgba(76, 141, 255, 0.5);
        }

        .send-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* 待发送图片预览 */
        .img-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .img-preview:empty {
            display: none;
        }

        .img-preview .pv-item {
            position: relative;
        }

        .img-preview .pv-item img {
            width: 56px;
            height: 56px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: block;
        }

        .img-preview .pv-item .pv-del {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #ff4d4f;
            color: #fff;
            border: none;
            font-size: 11px;
            line-height: 18px;
            cursor: pointer;
            text-align: center;
            padding: 0;
        }

        .input-hint {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.28);
            text-align: center;
            margin-top: 10px;
        }

        /* ---------- 未登录遮罩 ---------- */
        .login-mask {
            position: fixed;
            inset: 0;
            z-index: 50;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-mask.show {
            display: flex;
        }

        .login-mask-box {
            text-align: center;
            max-width: 360px;
            padding: 44px 38px;
            background: #141414;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.3s ease;
        }

        .login-mask-box .logo-big {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, #ff4e4e, #ff9f43, #ffe066, #2ed573, #1e90ff, #7c5cff, #ff4e4e);
            padding: 4px;
            margin: 0 auto 16px;
        }

        .login-mask-box .logo-big::before {
            content: '';
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #141414;
        }

        .login-mask-box h2 {
            font-size: 20px;
            color: #fff;
            margin-bottom: 8px;
        }

        .login-mask-box p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.7;
            margin-bottom: 26px;
        }

        .login-mask-box .btn-login,
        .login-mask-box .btn-home {
            display: inline-block;
            padding: 11px 34px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            margin: 0 6px;
        }

        .login-mask-box .btn-login {
            background: linear-gradient(135deg, #4d8dff, #7c5cff);
            color: #fff;
            box-shadow: 0 6px 16px rgba(76, 141, 255, 0.35);
        }

        .login-mask-box .btn-login:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 22px rgba(76, 141, 255, 0.5);
        }

        .login-mask-box .btn-home {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.18);
            color: #fff;
        }

        .login-mask-box .btn-home:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* ---------- 移动端 ---------- */
        @media (max-width: 860px) {
            .sidebar {
                position: fixed;
                top: 0;
                left: 0;
                bottom: 0;
                transform: translateX(-100%);
                box-shadow: 8px 0 30px rgba(0, 0, 0, 0.5);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .sidebar-mask.show {
                display: block;
            }

            .menu-btn {
                display: flex;
            }

            .chat-header { padding: 10px 14px; gap: 8px; }
            .chat-box { padding: 18px 12px; }
            .chat-input-wrap { padding: 10px 12px 14px; }
            .welcome h2 { font-size: 22px; }
            .mode-btn { padding: 5px 10px; font-size: 11.5px; }
            .model-select { max-width: 110px; font-size: 11px; padding: 6px 10px; }
            .chat-title p { display: none; }
            .msg .bubble { max-width: 86%; }
            .tips .tip-card { padding: 10px 14px; font-size: 12px; }
        }
    </style>
</head>
<body>

    <div class="app">
        <!-- 侧边栏（历史记录） -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-brand">
                    <span class="logo-mini"></span>
                    STC AI 助手
                </div>
                <button class="new-chat-btn" id="new-chat-btn">＋ 新建对话</button>
            </div>
            <div class="conv-list" id="conv-list">
                <div class="conv-empty">暂无历史对话<br>开始你的第一个问题吧</div>
            </div>
        </aside>
        <div class="sidebar-mask" id="sidebar-mask"></div>

        <div class="main">
            <!-- 顶部栏 -->
            <header class="chat-header">
                <button class="icon-btn menu-btn" id="menu-btn">☰</button>
                <div class="chat-logo"></div>
                <div class="chat-title">
                    <h1>STC AI 助手</h1>
                    <p id="header-sub">深度思考 · 图片识别 · 流式输出</p>
                </div>
                <div class="mode-switch">
                    <button class="mode-btn active" id="mode-deep">深度思考</button>
                    <button class="mode-btn" id="mode-fast">快速思考</button>
                </div>
                <select id="model-select" class="model-select" title="选择模型"></select>
            </header>

            <!-- 消息区 -->
            <main class="chat-box" id="chat-box">
                <div class="chat-box-inner" id="chat-box-inner">
                    <div class="welcome" id="welcome">
                        <h2>Hi，今天从哪里开始</h2>
                        <p class="sub">由商汤日日新（SenseNova）大模型驱动<br>支持深度思考、图片识别、连续对话</p>
                        <div class="tips">
                            <span class="tip-card">✍️ 写一段工作周报</span>
                            <span class="tip-card">💡 帮我解释什么是线程池</span>
                            <span class="tip-card">🐍 用 Python 写个贪吃蛇</span>
                            <span class="tip-card">😄 讲个冷笑话</span>
                        </div>
                    </div>
                </div>
            </main>

            <!-- 输入区 -->
            <div class="chat-input-wrap">
                <div class="chat-input-inner">
                    <div class="img-preview" id="img-preview"></div>
                    <div class="chat-input-bar">
                        <button class="img-btn" id="img-btn" title="上传图片（支持粘贴/拖拽）">🖼️</button>
                        <input type="file" id="file-input" accept="image/*" multiple hidden>
                        <textarea id="input" placeholder="输入你的问题，Enter 发送，Shift+Enter 换行"></textarea>

                    <div class="input-hint">内容由 AI 生成，仅供参考 · 支持图片识别与思考过程展示</div>
                </div>
            </div>
        </div>

        <!-- 未登录遮罩 -->
        <div class="login-mask" id="login-mask">
            <div class="login-mask-box">
                <div class="logo-big"></div>
                <h2>请先登录</h2>
                <p>AI 助手仅对已登录的 STC 成员开放</p>
                <a class="btn-login" href="/login">去登录</a>
                <a class="btn-home" href="/">返回首页</a>
            </div>
        </div>
    </div>

    <script>
        // ==================== 模型配置 ====================
        const MODELS = {
            'sensenova-6.7-flash-lite': 'SenseNova 6.7（推荐）',
            'sensenova-6.8-flash-lite': 'SenseNova 6.8',
            'glm-5.2': 'GLM-5.2',
            'deepseek-v4-flash': 'DeepSeek V4'
        };
        const DEEP_MODEL = 'sensenova-6.7-flash-lite';
        const FAST_MODEL = 'deepseek-v4-flash';
        const SYSTEM_PROMPT = '你是STC工会任务平台的AI助手，由商汤日日新（SenseNova）大模型提供技术支持。请用简洁、友好的中文回答问题，涉及代码时给出完整可运行的示例。可以分析用户上传的图片。';

        // ==================== 状态 ====================
        let convId = null;          // 当前会话 id（null = 尚未创建的新对话）
        let messages = [];          // 当前会话消息 [{role, content, images?, thinking?}]
        let pendingImages = [];     // 待发送图片 [{data, mime}]
        let sending = false;
        let thinkingMode = localStorage.getItem('stc_ai_thinking') || 'deep';

        // DOM
        const chatBox = document.getElementById('chat-box');
        const chatBoxInner = document.getElementById('chat-box-inner');
        const inputEl = document.getElementById('input');
        const sendBtn = document.getElementById('send-btn');
        const modelSelect = document.getElementById('model-select');
        const welcomeEl = document.getElementById('welcome');
        const convListEl = document.getElementById('conv-list');
        const imgPreviewEl = document.getElementById('img-preview');
        const sidebarEl = document.getElementById('sidebar');
        const sidebarMask = document.getElementById('sidebar-mask');

        // ==================== 工具函数 ====================
        function authHeaders() {
            const token = localStorage.getItem('stc_auth_token');
            return token ? { 'Authorization': 'Bearer ' + token } : {};
        }

        async function getCSRFToken() {
            try {
                const resp = await fetch('/api/csrf-token', { credentials: 'include' });
                if (resp.ok) {
                    const data = await resp.json();
                    return data.csrfToken;
                }
            } catch (e) {}
            return null;
        }

        function genNonce() {
            return Date.now().toString(36) + Math.random().toString(16).slice(2, 10);
        }

        // 统一 API 请求（写操作自动带 CSRF + nonce）
        async function api(path, { method = 'GET', body } = {}) {
            let token = null;
            if (method !== 'GET') token = await getCSRFToken();
            const resp = await fetch(path, {
                method,
                credentials: 'include',
                headers: {
                    'Content-Type': 'application/json',
                    ...authHeaders(),
                    ...(token ? { 'X-CSRF-Token': token } : {}),
                    'X-Request-Nonce': genNonce()
                },
                body: body ? JSON.stringify(body) : undefined
            });
            const data = await resp.json().catch(() => ({}));
            if (!resp.ok) throw new Error(data.message || data.error || ('请求失败 (' + resp.status + ')'));
            return data;
        }

        function escapeHtml(s) {
            return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function renderMarkdown(text) {
            const escaped = escapeHtml(text);
            const parts = escaped.split(/```/);
            let html = '';
            for (let i = 0; i < parts.length; i++) {
                if (i % 2 === 1) {
                    const code = parts[i].replace(/^[a-zA-Z]+\n/, '').replace(/\n$/, '');
                    html += '<pre class="code-block"><code>' + code + '</code></pre>';
                } else {
                    html += parts[i]
                        .replace(/`([^`]+)`/g, '<code>$1</code>')
                        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
                        .replace(/\n/g, '<br>');
                }
            }
            return html;
        }

        function scrollBottom() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function fmtTime(iso) {
            try {
                const d = new Date(iso);
                const now = new Date();
                const sameDay = d.toDateString() === now.toDateString();
                if (sameDay) return d.toTimeString().slice(0, 5);
                return (d.getMonth() + 1) + '/' + d.getDate();
            } catch (e) { return ''; }
        }

        function imgSrc(img) {
            return typeof img === 'string' ? img : ('data:' + (img.mime || 'image/jpeg') + ';base64,' + (img.data || ''));
        }

        // ==================== 消息渲染 ====================
        // 深度思考过程折叠框（静态版，用于历史消息）
        function buildThinkBox(reasoning) {
            const box = document.createElement('div');
            box.className = 'think-box';

            const header = document.createElement('div');
            header.className = 'think-header';
            const label = document.createElement('span');
            label.textContent = '🤔 深度思考过程';
            const toggle = document.createElement('span');
            toggle.className = 'think-toggle';
            toggle.textContent = '▾';
            header.appendChild(label);
            header.appendChild(toggle);

            const content = document.createElement('div');
            content.className = 'think-content';
            content.textContent = reasoning;

            box.appendChild(header);
            box.appendChild(content);
            header.addEventListener('click', () => box.classList.toggle('open'));
            return box;
        }

        function buildBubble(role, item) {
            const content = typeof item === 'string' ? item : (item.content || '');
            const images = typeof item === 'string' ? [] : (item.images || []);
            const thinking = typeof item === 'string' ? '' : (item.thinking || '');

            const wrap = document.createElement('div');
            wrap.className = 'msg msg-' + role;

            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            avatar.textContent = role === 'user' ? '我' : '';

            const bubble = document.createElement('div');
            bubble.className = 'bubble';

            // 思考过程（仅 AI）
            if (role === 'assistant' && thinking) {
                bubble.appendChild(buildThinkBox(thinking));
            }

            // 图片（仅用户）
            if (role === 'user' && images.length) {
                const imgWrap = document.createElement('div');
                imgWrap.className = 'msg-images';
                for (const img of images.slice(0, 4)) {
                    const im = document.createElement('img');
                    im.src = imgSrc(img);
                    imgWrap.appendChild(im);
                }
                bubble.appendChild(imgWrap);
            }

            const text = document.createElement('div');
            text.className = 'msg-text';
            if (role === 'assistant') {
                text.innerHTML = content ? renderMarkdown(content) : '';
            } else {
                text.textContent = content;
            }
            bubble.appendChild(text);

            wrap.appendChild(avatar);
            wrap.appendChild(bubble);
            return wrap;
        }

        function appendBubble(role, item) {
            welcomeEl.style.display = 'none';
            const el = buildBubble(role, item);
            chatBoxInner.appendChild(el);
            scrollBottom();
            return el;
        }

        function showThinking() {
            const wrap = document.createElement('div');
            wrap.className = 'msg msg-ai thinking';
            wrap.id = 'thinking-msg';
            const avatar = document.createElement('div');
            avatar.className = 'avatar';
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            for (let i = 0; i < 3; i++) {
                const dot = document.createElement('span');
                dot.className = 'dot';
                bubble.appendChild(dot);
            }
            wrap.appendChild(avatar);
            wrap.appendChild(bubble);
            chatBoxInner.appendChild(wrap);
            scrollBottom();
        }

        function removeThinking() {
            const t = document.getElementById('thinking-msg');
            if (t) t.remove();
        }

        function renderAll() {
            chatBoxInner.querySelectorAll('.msg').forEach(el => el.remove());
            welcomeEl.style.display = messages.length ? 'none' : '';
            for (const m of messages) {
                chatBoxInner.appendChild(buildBubble(m.role, m));
            }
            scrollBottom();
        }

        // ==================== 侧边栏：会话历史 ====================
        async function loadConvs() {
            try {
                const data = await api('/api/ai/conversations');
                renderConvList(data.data || []);
            } catch (e) {
                console.error('[AI] 加载会话列表失败:', e.message);
            }
        }

        function renderConvList(list) {
            convListEl.innerHTML = '';
            if (!list.length) {
                const empty = document.createElement('div');
                empty.className = 'conv-empty';
                empty.textContent = '暂无历史对话';
                convListEl.appendChild(empty);
                return;
            }
            for (const c of list) {
                const item = document.createElement('div');
                item.className = 'conv-item' + (convId === c.id ? ' active' : '');
                item.dataset.id = c.id;

                const body = document.createElement('div');
                body.className = 'conv-body';
                const title = document.createElement('div');
                title.className = 'conv-title';
                title.textContent = c.title || '新对话';
                const meta = document.createElement('div');
                meta.className = 'conv-meta';
                meta.textContent = fmtTime(c.updated_at) + ' · ' + c.message_count + ' 条';
                body.appendChild(title);
                body.appendChild(meta);

                const del = document.createElement('button');
                del.className = 'conv-del';
                del.title = '删除对话';
                del.textContent = '✕';

                item.appendChild(body);
                item.appendChild(del);
                convListEl.appendChild(item);
            }
        }

        async function openConv(id) {
            if (sending) return;
            try {
                const data = await api('/api/ai/conversations/' + id);
                const conv = data.data;
                convId = conv.id;
                messages = (conv.messages || []).map(m => ({
                    role: m.role,
                    content: m.content || '',
                    images: m.images || [],
                    thinking: m.thinking || ''
                }));
                renderAll();
                renderConvList2();
                closeSidebar();
            } catch (e) {
                console.error('[AI] 加载会话失败:', e.message);
            }
        }

        // 刷新当前高亮（复用已拉取的列表不现实，直接重新加载一次）
        function renderConvList2() {
            loadConvs();
        }

        function newChat() {
            if (sending) return;
            convId = null;
            messages = [];
            pendingImages = [];
            renderPreview();
            renderAll();
            loadConvs();
            closeSidebar();
            inputEl.focus();
        }

        async function deleteConv(id) {
            if (!confirm('确定删除该对话吗？')) return;
            try {
                await api('/api/ai/conversations/' + id, { method: 'DELETE' });
                if (convId === id) {
                    convId = null;
                    messages = [];
                    renderAll();
                }
                loadConvs();
            } catch (e) {
                console.error('[AI] 删除会话失败:', e.message);
                alert('删除失败：' + e.message);
            }
        }

        function closeSidebar() {
            sidebarEl.classList.remove('open');
            sidebarMask.classList.remove('show');
        }

        // ==================== 图片处理 ====================
        async function handleFiles(files) {
            const fileList = Array.from(files || []).filter(f => f && f.type && f.type.startsWith('image/'));
            if (!fileList.length) return;
            const room = 4 - pendingImages.length;
            for (const f of fileList.slice(0, room)) {
                try {
                    const compressed = await compressImage(f);
                    pendingImages.push(compressed);
                } catch (e) {
                    console.error('[AI] 图片压缩失败:', e.message);
                }
            }
            if (pendingImages.length >= 4) alert('最多支持 4 张图片');
            renderPreview();
        }

        // 图片压缩（canvas 缩小 + JPEG，控制体积）
        function compressImage(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const img = new Image();
                    img.onload = () => {
                        const MAX = 1280;
                        let w = img.width, h = img.height;
                        if (w > MAX || h > MAX) {
                            const ratio = Math.min(MAX / w, MAX / h);
                            w = Math.round(w * ratio);
                            h = Math.round(h * ratio);
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = w;
                        canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                        const comma = dataUrl.indexOf(',');
                        resolve({ data: dataUrl.slice(comma + 1), mime: 'image/jpeg' });
                    };
                    img.onerror = () => reject(new Error('图片解析失败'));
                    img.src = reader.result;
                };
                reader.onerror = () => reject(new Error('文件读取失败'));
                reader.readAsDataURL(file);
            });
        }

        function renderPreview() {
            imgPreviewEl.innerHTML = '';
            pendingImages.forEach((img, i) => {
                const item = document.createElement('div');
                item.className = 'pv-item';
                const im = document.createElement('img');
                im.src = imgSrc(img);
                const del = document.createElement('button');
                del.className = 'pv-del';
                del.textContent = '✕';
                del.addEventListener('click', () => {
                    pendingImages.splice(i, 1);
                    renderPreview();
                });
                item.appendChild(im);
                item.appendChild(del);
                imgPreviewEl.appendChild(item);
            });
        }

        // ==================== 发送消息（流式） ====================
        async function send() {
            const text = inputEl.value.trim();
            if ((!text && !pendingImages.length) || sending) return;

            const userMsg = { role: 'user', content: text, images: pendingImages.slice() };
            inputEl.value = '';
            pendingImages = [];
            renderPreview();
            autoResize();

            messages.push(userMsg);
            appendBubble('user', userMsg);
            showThinking();

            sending = true;
            sendBtn.disabled = true;

            try {
                // 确保存在会话（首次提问自动创建）
                if (!convId) {
                    const cs = await api('/api/ai/conversations', { method: 'POST', body: { title: text.slice(0, 20) || '新对话' } });
                    convId = cs.data.id;
                    loadConvs();
                }

                let resp = null;
                let retried = false;
                for (;;) {
                    const token = await getCSRFToken();
                    resp = await fetch('/api/ai/chat', {
                        method: 'POST',
                        credentials: 'include',
                        headers: {
                            'Content-Type': 'application/json',
                            ...authHeaders(),
                            ...(token ? { 'X-CSRF-Token': token } : {}),
                            'X-Request-Nonce': genNonce()
                        },
                        body: JSON.stringify({
                            messages: [{ role: 'system', content: SYSTEM_PROMPT }, ...messages],
                            model: modelSelect.value,
                            conversationId: convId,
                            thinking: thinkingMode
                        })
                    });
                    if (resp.status === 403 && !retried) {
                        retried = true;
                        continue;
                    }
                    break;
                }

                if (!resp.ok) {
                    const err = await resp.json().catch(() => ({}));
                    if (resp.status === 403 && (err.error === '请先登录' || err.message === '请先登录')) {
                        showLoginMask();
                    }
                    throw new Error(err.message || err.error || ('请求失败 (' + resp.status + ')，请稍后重试'));
                }

                // 把"思考中"气泡升级为正式 AI 气泡
                removeThinking();
                const aiEl = appendBubble('assistant', '');
                const bubbleEl = aiEl.querySelector('.bubble');
                const aiTextEl = aiEl.querySelector('.msg-text');

                const reader = resp.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';
                let full = '';
                let reasoning = '';
                let thinkBox = null;
                let thinkContentEl = null;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });

                    const parts = buffer.split('\n\n');
                    buffer = parts.pop();
                    for (const part of parts) {
                        const line = part.split('\n').find(l => l.startsWith('data:'));
                        if (!line) continue;
                        const data = line.slice(5).trim();
                        if (!data || data === '[DONE]') continue;
                        try {
                            const json = JSON.parse(data);
                            const delta = json.choices && json.choices[0] && json.choices[0].delta;
                            if (!delta) continue;

                            // 深度思考：实时展示推理链
                            if (delta.reasoning && thinkingMode === 'deep') {
                                reasoning += delta.reasoning;
                                if (!thinkBox) {
                                    thinkBox = document.createElement('div');
                                    thinkBox.className = 'think-box live';
                                    const header = document.createElement('div');
                                    header.className = 'think-header';
                                    const label = document.createElement('span');
                                    label.textContent = '🤔 深度思考中…';
                                    const toggle = document.createElement('span');
                                    toggle.className = 'think-toggle';
                                    toggle.textContent = '▾';
                                    header.appendChild(label);
                                    header.appendChild(toggle);
                                    thinkContentEl = document.createElement('div');
                                    thinkContentEl.className = 'think-content';
                                    thinkBox.appendChild(header);
                                    thinkBox.appendChild(thinkContentEl);
                                    bubbleEl.insertBefore(thinkBox, aiTextEl);
                                }
                                thinkContentEl.textContent = reasoning;
                                scrollBottom();
                            }

                            // 正文
                            if (delta.content) {
                                full += delta.content;
                                aiTextEl.textContent = full;
                                scrollBottom();
                            }
                        } catch (e) { /* 忽略解析失败 */ }
                    }
                }

                // 流结束：渲染完整 markdown，思考过程折叠
                aiTextEl.innerHTML = full ? renderMarkdown(full) : '（未收到回复，请重试）';
                if (thinkBox) {
                    thinkBox.classList.remove('live');
                    thinkBox.querySelector('.think-header span').textContent = '🤔 深度思考过程';
                }
                messages.push({
                    role: 'assistant',
                    content: full,
                    thinking: (thinkingMode === 'deep' && reasoning) ? reasoning : undefined
                });
                loadConvs(); // 刷新会话标题/时间
            } catch (e) {
                removeThinking();
                appendBubble('system', '❌ ' + e.message);
            } finally {
                sending = false;
                sendBtn.disabled = false;
                inputEl.focus();
                scrollBottom();
            }
        }

        // ==================== 输入框自适应 ====================
        function autoResize() {
            inputEl.style.height = 'auto';
            inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
        }

        // ==================== 思考模式切换 ====================
        function setThinkingMode(mode, forceModel = true) {
            thinkingMode = mode;
            localStorage.setItem('stc_ai_thinking', mode);
            if (forceModel) {
                modelSelect.value = mode === 'deep' ? DEEP_MODEL : FAST_MODEL;
                localStorage.setItem('stc_ai_model', modelSelect.value);
            }
            document.getElementById('mode-deep').classList.toggle('active', mode === 'deep');
            document.getElementById('mode-fast').classList.toggle('active', mode === 'fast');
            document.getElementById('header-sub').textContent = mode === 'deep'
                ? '深度思考 · 图片识别 · 流式输出'
                : '快速响应 · 图片识别 · 流式输出';
        }

        // ==================== 事件绑定 ====================
        sendBtn.addEventListener('click', send);

        inputEl.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                send();
            }
        });

        inputEl.addEventListener('input', autoResize);

        document.getElementById('new-chat-btn').addEventListener('click', newChat);
        document.getElementById('menu-btn').addEventListener('click', () => {
            sidebarEl.classList.add('open');
            sidebarMask.classList.add('show');
        });
        sidebarMask.addEventListener('click', closeSidebar);

        // 会话列表事件委托（切换 / 删除）
        convListEl.addEventListener('click', (e) => {
            const item = e.target.closest('.conv-item');
            if (!item) return;
            if (e.target.classList.contains('conv-del')) {
                deleteConv(item.dataset.id);
            } else {
                openConv(item.dataset.id);
            }
        });

        modelSelect.addEventListener('change', () => {
            localStorage.setItem('stc_ai_model', modelSelect.value);
        });

        document.getElementById('mode-deep').addEventListener('click', () => setThinkingMode('deep'));
        document.getElementById('mode-fast').addEventListener('click', () => setThinkingMode('fast'));

        // 图片上传
        const fileInput = document.getElementById('file-input');
        document.getElementById('img-btn').addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', () => {
            handleFiles(fileInput.files);
            fileInput.value = '';
        });

        // 粘贴图片
        inputEl.addEventListener('paste', (e) => {
            const items = e.clipboardData && e.clipboardData.items;
            if (!items) return;
            const files = [];
            for (const it of items) {
                if (it.type && it.type.startsWith('image/')) {
                    const f = it.getAsFile();
                    if (f) files.push(f);
                }
            }
            if (files.length) {
                e.preventDefault();
                handleFiles(files);
            }
        });

        // 拖拽图片到输入框
        const inputWrap = document.querySelector('.chat-input-inner');
        ['dragover', 'dragenter'].forEach(ev => {
            inputWrap.addEventListener(ev, (e) => {
                e.preventDefault();
                inputWrap.classList.add('drag-over');
            });
        });
        ['dragleave', 'drop'].forEach(ev => {
            inputWrap.addEventListener(ev, (e) => {
                e.preventDefault();
                inputWrap.classList.remove('drag-over');
            });
        });
        inputWrap.addEventListener('drop', (e) => {
            if (e.dataTransfer && e.dataTransfer.files) {
                handleFiles(e.dataTransfer.files);
            }
        });

        // 欢迎页快捷提问
        welcomeEl.querySelectorAll('.tips span').forEach(span => {
            span.addEventListener('click', () => {
                inputEl.value = span.textContent.replace(/^[^\u4e00-\u9fa5a-zA-Z0-9]+/, '');
                autoResize();
                inputEl.focus();
            });
        });

        // ==================== 登录校验 ====================
        const loginMask = document.getElementById('login-mask');

        function showLoginMask() {
            loginMask.classList.add('show');
            inputEl.disabled = true;
            sendBtn.disabled = true;
        }

        async function checkLogin() {
            try {
                const resp = await fetch('/api/user', { credentials: 'include', headers: authHeaders() });
                if (resp.ok) return true;
            } catch (e) {}
            return false;
        }

        // ==================== 初始化 ====================
        (async function init() {
            const loggedIn = await checkLogin();
            if (!loggedIn) {
                showLoginMask();
                return;
            }

            // 填充模型下拉
            for (const [value, label] of Object.entries(MODELS)) {
                const opt = document.createElement('option');
                opt.value = value;
                opt.textContent = label;
                modelSelect.appendChild(opt);
            }
            const savedModel = localStorage.getItem('stc_ai_model');
            modelSelect.value = MODELS[savedModel] ? savedModel : (thinkingMode === 'deep' ? DEEP_MODEL : FAST_MODEL);
            setThinkingMode(thinkingMode, false);

            getCSRFToken(); // 预取 CSRF token，首次提问更快
            await loadConvs();
            renderAll();
            inputEl.focus();
        })();
    </script>
</body>
</html>
