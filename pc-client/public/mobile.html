<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1c1f">
<title>STC 手机互传</title>
<style>
  :root{
    --bg:#f4f4f5; --card:#fff; --text:#1f1f22; --sub:#6b6b73;
    --line:#e3e3e6; --soft:#f7f7f8; --accent:#4a4a4a; --danger:#b3261e; --ok:#2e7d32;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#131315; --card:#1c1c1f; --text:#ececee; --sub:#9a9aa2; --line:#2c2c31; --soft:#232327; --danger:#ff6b60; --ok:#7bc67e; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,"Microsoft YaHei",system-ui,sans-serif}
  .app{max-width:640px;margin:0 auto;padding:14px 14px 90px}
  h1{font-size:17px;margin:8px 0 4px;font-weight:600}
  .muted{color:var(--sub);font-size:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--soft);color:var(--text);border-radius:9px;padding:9px 13px}
  button.primary{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:600}
  button.danger{color:var(--danger);border-color:var(--danger)}
  button.ghost{background:transparent}
  button:disabled{opacity:.5}
  input.code{
    width:100%;text-align:center;font:600 34px/1.2 ui-monospace,Consolas,monospace;letter-spacing:.28em;
    padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--text);
  }
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px;border-bottom:1px solid var(--line)}
  .path{font:12px ui-monospace,Consolas,monospace;color:var(--sub);word-break:break-all;margin:6px 0 8px}
  ul.list{list-style:none;margin:0;padding:0}
  ul.list li{display:flex;align-items:center;gap:8px;padding:11px 2px;border-bottom:1px solid var(--line)}
  ul.list li:last-child{border-bottom:0}
  .icon{width:40px;height:40px;flex:0 0 40px;border-radius:9px;background:var(--soft);border:1px solid var(--line);
        display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--sub);text-align:center;line-height:1.1}
  .meta{flex:1;min-width:0}
  .meta .n{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .meta .s{font-size:11px;color:var(--sub)}
  select{font:inherit;background:var(--soft);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:8px}
  .prog{height:6px;background:var(--soft);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-top:8px}
  .prog > i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--text);color:var(--bg);
         padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:88vw;text-align:center}
  .toast.on{opacity:.94}
  .hidden{display:none !important}
  .steps{color:var(--sub);font-size:13px;padding-left:18px;margin:6px 0 0}
  .steps li{margin-bottom:4px}
</style>
</head>
<body>
<div class="app">

  <!-- 未配对 -->
  <section id="view-pair">
    <h1>连接电脑</h1>
    <div class="muted" id="pair-sub">在电脑端面板上查看 6 位配对码</div>
    <div class="card" style="margin-top:12px">
      <input class="code" id="code-input" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000">
      <div class="row" style="margin-top:12px">
        <button class="primary" id="btn-pair" style="flex:1">连接</button>
      </div>
      <div class="prog hidden" id="pair-prog"><i></i></div>
      <div class="muted" id="pair-msg" style="margin-top:10px"></div>
    </div>
    <div class="card">
      <b>怎么用</b>
      <ol class="steps">
        <li>电脑和手机连同一个 WiFi。</li>
        <li>电脑上运行 start.cmd，面板里能看到配对码和访问地址。</li>
        <li>手机就是现在这个页面，输入配对码即可浏览 / 上传 / 下载电脑文件。</li>
      </ol>
    </div>
  </section>

  <!-- 已配对 -->
  <section id="view-files" class="hidden">
    <div class="bar">
      <div class="row" style="justify-content:space-between">
        <b>电脑上的文件</b>
        <span class="muted" id="dev-name"></span>
      </div>
      <div class="row" style="margin-top:8px">
        <button class="ghost" id="btn-up">↑ 上级</button>
        <button class="ghost" id="btn-refresh">刷新</button>
        <button class="ghost" id="btn-mkdir">新建文件夹</button>
        <button class="ghost danger" id="btn-unpair">断开</button>
      </div>
      <div class="row" style="margin-top:8px">
        <select id="root-select"></select>
        <button class="primary" id="btn-upload">上传文件到此处</button>
      </div>
      <div class="path" id="cur-path"></div>
      <div class="prog hidden" id="up-prog"><i></i></div>
      <div class="muted hidden" id="up-text"></div>
    </div>
    <ul class="list" id="entries"></ul>
    <div class="muted hidden" id="empty">这个文件夹是空的</div>
    <div class="card" style="margin-top:12px">
      <div class="muted">下载的文件会保存到手机浏览器默认下载目录；上传的文件保存到电脑端当前浏览的文件夹。</div>
    </div>
  </section>
</div>

<input type="file" id="file-input" multiple class="hidden">
<div class="toast" id="toast"></div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var st = { path:'', parent:'', roots:[], allowWrite:true, device:null, inbox:'' };

  function toast(msg){
    var t = $('toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove('on'); }, 2200);
  }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
  function fmtSize(n){
    if (!n && n !== 0) return '';
    var u = ['B','KB','MB','GB','TB'], i = 0;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return (i === 0 ? n : n.toFixed(2)) + ' ' + u[i];
  }
  function fmtTime(ms){
    if (!ms) return '-';
    var d = new Date(ms), p = function(x){ return (x < 10 ? '0' : '') + x; };
    return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function label(e){
    var dot = e.name.lastIndexOf('.');
    var ext = (dot > 0) ? e.name.slice(dot+1).toUpperCase() : '';
    if (e.dir) return '文件夹';
    return (ext && ext.length <= 4) ? ext : '文件';
  }
  function get(path){
    return fetch(path, {credentials:'same-origin'}).then(function(r){ return r.json(); });
  }
  function post(path, body){
    return fetch(path, {
      method:'POST', credentials:'same-origin',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body || {})
    }).then(function(r){ return r.json(); });
  }

  // ---------------------------------------------------------- 配对
  function pair(){
    var code = ($('code-input').value || '').replace(/\D/g, '');
    if (code.length !== 6) { toast('请输入 6 位配对码'); return; }
    $('btn-pair').disabled = true;
    $('pair-msg').textContent = '正在连接…';
    post('/api/pair', { code: code, name: '手机浏览器', kind: 'web' }).then(function(r){
      $('btn-pair').disabled = false;
      if (!r.ok) { $('pair-msg').textContent = r.message || '配对失败'; return; }
      $('pair-msg').textContent = '';
      enter();
    }).catch(function(e){
      $('btn-pair').disabled = false;
      $('pair-msg').textContent = '网络错误：' + e.message;
    });
  }
  $('btn-pair').addEventListener('click', pair);
  $('code-input').addEventListener('keydown', function(e){ if (e.key === 'Enter') pair(); });

  // ---------------------------------------------------------- 进入文件界面
  function enter(){
    $('view-pair').classList.add('hidden');
    $('view-files').classList.remove('hidden');
    get('/api/session').then(function(r){
      if (!r.ok) { backToPair(r.message); return; }
      st.device = r.device; st.allowWrite = r.allowWrite; st.inbox = r.inbox;
      st.roots = r.roots || [];
      $('dev-name').textContent = r.device.name;
      $('root-select').innerHTML = st.roots.map(function(x){
        return '<option value="' + esc(x.path) + '">' + esc(x.label) + '</option>';
      }).join('');
      load('');
    });
  }
  function backToPair(msg){
    $('view-files').classList.add('hidden');
    $('view-pair').classList.remove('hidden');
    if (msg) $('pair-msg').textContent = msg;
  }

  // ---------------------------------------------------------- 列表
  function load(path){
    get('/api/list' + (path ? '?path=' + encodeURIComponent(path) : '')).then(function(r){
      if (!r.ok) { toast(r.message || '读取失败'); if (r.needPair) backToPair(r.message); return; }
      st.path = r.path; st.parent = r.parent; st.allowWrite = r.allowWrite;
      $('cur-path').textContent = r.path + (r.allowWrite ? '' : '（只读）');
      $('btn-up').disabled = !r.parent;
      var es = r.entries || [];
      $('empty').classList.toggle('hidden', es.length > 0);
      $('entries').innerHTML = es.map(function(e, i){
        var full = e.path || e.name;
        return '<li>' +
          '<span class="icon">' + esc(label(e)) + '</span>' +
          '<span class="meta" data-open="' + (e.dir ? '1' : '') + '" data-path="' + esc(full) + '">' +
            '<span class="n">' + esc(e.name) + '</span>' +
            '<span class="s">' + (e.dir ? '文件夹' : fmtSize(e.size) + ' · ' + fmtTime(e.mtime)) + '</span>' +
          '</span>' +
          (e.dir
            ? '<button data-into="' + esc(full) + '">进入</button>'
            : '<button data-dl="' + esc(full) + '">下载</button>') +
          (st.allowWrite ? '<button class="danger" data-del="' + esc(full) + '">删</button>' : '') +
          '</li>';
      }).join('');
    });
  }

  $('btn-refresh').addEventListener('click', function(){ load(st.path); });
  $('btn-up').addEventListener('click', function(){ if (st.parent) load(st.parent); });
  $('root-select').addEventListener('change', function(){ load(this.value); });

  $('btn-mkdir').addEventListener('click', function(){
    var name = prompt('新文件夹名称：');
    if (!name) return;
    var sep = st.path.indexOf('/') >= 0 ? '/' : '\\';
    post('/api/mkdir', { path: st.path + (st.path.slice(-1) === sep ? '' : sep) + name }).then(function(r){
      toast(r.message || (r.ok ? '已创建' : '创建失败'));
      load(st.path);
    });
  });

  $('btn-unpair').addEventListener('click', function(){
    if (!confirm('断开与这台电脑的连接？')) return;
    post('/api/unpair').then(function(){ backToPair('已断开连接'); });
  });

  document.addEventListener('click', function(e){
    var t = e.target;
    if (!t.dataset) return;
    if (t.dataset.into) { load(t.dataset.into); return; }
    if (t.dataset.dl) { location.href = '/api/download?path=' + encodeURIComponent(t.dataset.dl); toast('开始下载'); return; }
    if (t.dataset.del) {
      if (!confirm('确定删除「' + t.dataset.del.split('\\').pop() + '」？删除后无法恢复。')) return;
      post('/api/delete', { paths: [t.dataset.del] }).then(function(r){
        toast(r.message || (r.ok ? '已删除' : '删除失败'));
        load(st.path);
      });
      return;
    }
    var open = t.closest ? t.closest('[data-open="1"]') : null;
    if (open) { load(open.dataset.path); }
  });

  // ---------------------------------------------------------- 上传
  $('btn-upload').addEventListener('click', function(){
    if (!st.allowWrite) { toast('电脑端当前是只读模式'); return; }
    $('file-input').click();
  });
  $('file-input').addEventListener('change', function(){
    var files = Array.prototype.slice.call(this.files || []);
    this.value = '';
    if (!files.length) return;
    uploadNext(files, 0);
  });

  function uploadNext(files, index){
    if (index >= files.length) {
      $('up-prog').classList.add('hidden');
      $('up-text').classList.add('hidden');
      toast('上传完成');
      load(st.path);
      return;
    }
    var f = files[index];
    var url = '/api/upload?dir=' + encodeURIComponent(st.path) + '&name=' + encodeURIComponent(f.name);
    var xhr = new XMLHttpRequest();
    xhr.open('PUT', url, true);
    xhr.upload.onprogress = function(e){
      if (!e.lengthComputable) return;
      var pct = Math.round(e.loaded / e.total * 100);
      $('up-prog').querySelector('i').style.width = pct + '%';
      $('up-text').textContent = '正在上传 ' + (index+1) + '/' + files.length + '：' + f.name + ' ' + pct + '%';
    };
    xhr.onload = function(){
      var r = {};
      try { r = JSON.parse(xhr.responseText); } catch (_) {}
      if (!r.ok) toast(r.message || '上传失败');
      uploadNext(files, index + 1);
    };
    xhr.onerror = function(){ toast('上传失败（网络中断）'); uploadNext(files, index + 1); };
    $('up-prog').classList.remove('hidden');
    $('up-text').classList.remove('hidden');
    $('up-prog').querySelector('i').style.width = '0%';
    $('up-text').textContent = '正在上传 ' + (index+1) + '/' + files.length + '：' + f.name;
    xhr.send(f);
  }

  // ---------------------------------------------------------- 启动
  $('pair-sub').textContent = '正在连接 ' + location.host + '，请查看电脑端面板上的 6 位配对码';
  get('/api/session').then(function(r){
    if (r.ok) enter();
  }).catch(function(){});
})();
</script>
</body>
</html>
