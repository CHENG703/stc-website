# 本机内存较小，限制 Gradle / Kotlin 守护进程内存，避免 OOM
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false
kotlin.daemon.jvmargs=-Xmx1024m

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# 本项目位于含中文的目录（D:\Desktop\STC网站），AGP 默认会因非 ASCII 路径拒绝构建。
# 这里使用官方提供的开关绕过；若后续遇到路径相关的奇怪报错，把工程移到纯英文路径即可。
android.overridePathCheck=true
